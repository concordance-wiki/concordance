# SonarCloud analysis, run by the pipeline after the tests so that the coverage
# report of the whole suite reaches the dashboard. Automatic analysis must stay
# off on the SonarCloud side: the two cannot run together.
sonar.projectKey=concordance-wiki_concordance
sonar.organization=concordance-wiki

sonar.sources=packages,plugins,presets,scripts,distribution,docs/site
sonar.inclusions=**/src/**,scripts/**,distribution/**,docs/site/index.html
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.woff2
sonar.tests=packages,plugins,presets
sonar.test.inclusions=**/test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=packages/cli/src/bin.ts,scripts/**,distribution/**,docs/site/**
# Declarative tables are repetitive by nature: the gallery fixtures (one view model per
# state) and the message identifier map; duplication is measured on the logic, not on data.
sonar.cpd.exclusions=packages/site/src/gallery/fixtures/**,packages/i18n/src/areas/**,packages/i18n/src/ids.ts
