name: Feature
description: A change to what the tool does.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would change, in configuration, output or behaviour. Say how it fits the principles in docs/spec/requirements.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
