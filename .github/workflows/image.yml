name: image

# Builds the container image, checks that a build inside the container gives
# the same files as a build outside, measures the image and, on a release tag,
# publishes it to Docker Hub.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - packages/**
      - plugins/**
      - presets/**
      - pnpm-lock.yaml
      - scripts/compare-builds.mjs
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: concordancewiki/concordance
  CORPUS: fixtures/corpora/minimal/en

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      size: ${{ steps.size.outputs.size }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve the version
        id: version
        # A tag v1.2.3 gives 1.2.3; any other run is identified by its commit.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the entry point, the user and the system tools
        run: |
          docker run --rm "$IMAGE:ci" | grep -q '^usage: concordance'
          test "$(docker run --rm --entrypoint id "$IMAGE:ci" -u)" = 1000
          test "$(docker run --rm --entrypoint id "$IMAGE:ci" -un)" = concordance
          docker run --rm --entrypoint soffice "$IMAGE:ci" --version
          docker run --rm --entrypoint git "$IMAGE:ci" --version
          docker run --rm --entrypoint fc-list "$IMAGE:ci" | grep -qi carlito
          docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:ci" \
            | grep -qxF "${{ steps.version.outputs.version }}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the golden corpus inside and outside the container
        # The build exits 0 once its log, its model, its fragments and its site
        # are written; any other status fails here, as it does in the
        # determinism check, and every file of the two trees is compared.
        run: |
          accept() {
            set +e
            "$@" 2> build.stderr
            local status=$?
            set -e
            cat build.stderr >&2
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            echo "the build exited with $status"
            return 1
          }
          work=$(mktemp -d)
          cp -R "$CORPUS" "$work/wiki"
          chmod -R a+rwX "$work/wiki"
          # Both builds read the same copy: a local source records the modification time of its files.
          accept env SOURCE_DATE_EPOCH=0 node packages/cli/dist/bin.js build --config "$work/wiki/concordance.yaml" --output "$work/outside"
          accept docker run --rm -v "$work/wiki:/wiki" -e SOURCE_DATE_EPOCH=0 "$IMAGE:ci" build
          test -f "$work/wiki/dist/build.log.json"
          test -f "$work/wiki/dist/index.html"
          node scripts/compare-builds.mjs "$work/outside" "$work/wiki/dist"
      - name: Check that the container writes nothing but dist and the cache
        run: |
          work=$(mktemp -d)
          cp -R "$CORPUS" "$work/wiki"
          chmod -R a+rwX "$work/wiki"
          (cd "$work/wiki" && find . -type f | sort) > "$work/before"
          docker run --rm -v "$work/wiki:/wiki" "$IMAGE:ci" build || true
          (cd "$work/wiki" && find . -type f -not -path './dist/*' -not -path './.concordance-cache/*' | sort) > "$work/after"
          diff "$work/before" "$work/after"
      - name: Measure the image
        id: size
        run: |
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE:ci")
          human=$(numfmt --to=iec-i --suffix=B "$size")
          echo "size=$human ($size bytes)" >> "$GITHUB_OUTPUT"
          {
            echo "## Container image"
            echo
            echo "| Image | Version | Size |"
            echo "|---|---|---|"
            echo "| \`$IMAGE\` | ${{ steps.version.outputs.version }} | $human ($size bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the image for publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save "$IMAGE:ci" | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    # Enabled by the maintainer at the first release: replace `false` with
    # `startsWith(github.ref, 'refs/tags/v')` once the Docker Hub repository and
    # the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist.
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - run: docker load --input image.tar.gz
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the image tested above under its version and latest
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:${{ needs.build.outputs.version }}"
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker push "$IMAGE:${{ needs.build.outputs.version }}"
          docker push "$IMAGE:latest"
      - name: Announce the publication
        run: |
          {
            echo "## Release"
            echo
            echo "Published \`$IMAGE:${{ needs.build.outputs.version }}\` and \`$IMAGE:latest\`, ${{ needs.build.outputs.size }}."
          } >> "$GITHUB_STEP_SUMMARY"
