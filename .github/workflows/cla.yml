name: cla

# Every pull request from an account that has not signed the contributor licence agreement gets
# a comment asking for the signature and a failing check until it is recorded. Signatures live
# in the `cla-signatures` branch of this repository, nowhere else; the maintainer and the bots
# that open dependency pull requests are exempt.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/concordance-wiki/concordance/blob/main/CLA.md
          branch: cla-signatures
          allowlist: qnjoly,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thank you for the pull request. Before it can be merged, please read the [contributor licence agreement](https://github.com/concordance-wiki/concordance/blob/main/CLA.md) (five minutes: you keep your copyright, the project keeps one legal basis) and sign it by posting the sentence below as a comment on this pull request."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "Every contributor of this pull request has signed the contributor licence agreement."
          lock-pullrequest-aftermerge: false
