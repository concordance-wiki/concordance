name: pages

# Publishes the home page of the organisation, docs/site, on GitHub Pages at the
# root of the project site. The whole folder is the artifact: the page, its fonts
# and their licence; nothing is generated. One human step, once: in the settings
# of the repository, Pages → Source → "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
