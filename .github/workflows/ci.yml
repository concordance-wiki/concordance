name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch supersedes the run in progress; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, format, type check, schemas and fixtures
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Walkthrough
        # Every command of the getting-started guide, on a copy of the golden corpus, through the built command line.
        run: node scripts/walkthrough.mjs
      - name: Component gallery
        # Every slot rendered with fixture data; fails on a page over budget or an accessibility finding.
        run: node packages/cli/dist/bin.js gallery --output reports/gallery
      - name: Publish component gallery
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: reports/gallery
          if-no-files-found: error
      - name: Test with full coverage
        env:
          CONCORDANCE_INTEGRATION: "1"
        run: pnpm test
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Mutation testing
        # A pull request mutates only the files it changed; main mutates everything.
        run: ${{ github.event_name == 'pull_request' && format('node scripts/mutation.mjs --since origin/{0}', github.event.pull_request.base.ref) || 'pnpm mutation' }}
      - name: Determinism
        run: node scripts/determinism.mjs
      - name: Hygiene
        env:
          HYGIENE_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~20..HEAD' }}
        run: node scripts/hygiene.mjs
      - name: Licences
        run: pnpm licenses:check
