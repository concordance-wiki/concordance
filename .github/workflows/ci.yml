name: ci

on:
  pull_request:
    # Labels take part in the changeset step: a label change runs the pipeline again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch supersedes the run in progress; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Changeset
        # A pull request that changes a published package carries a changeset. The label
        # no-changeset lifts the requirement, with the reason in the pull request; the version
        # pull request consumes the changesets instead of adding one.
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changeset')
          && !startsWith(github.event.pull_request.title, 'chore(release): v')
        run: pnpm changeset status --since origin/${{ github.event.pull_request.base.ref }}
      - name: Lint, format, type check, schemas and fixtures
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Walkthrough
        # Every command of the getting-started guide, on a copy of the golden corpus, through the built command line.
        run: node scripts/walkthrough.mjs
      - name: Component gallery
        # Every slot rendered with fixture data; fails on a page over budget or an accessibility finding.
        run: node packages/cli/dist/bin.js gallery --output reports/gallery
      - name: Publish component gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery
          path: reports/gallery
          if-no-files-found: error
      - name: Test with full coverage
        env:
          CONCORDANCE_INTEGRATION: "1"
        run: pnpm test
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - name: SonarCloud analysis
        # Reads sonar-project.properties and the coverage report of the step above; skipped when the
        # token is absent (a fork, a local run), and the analysis of the dashboard then waits for main.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      - name: Determinism
        run: node scripts/determinism.mjs
      - name: Hygiene
        env:
          HYGIENE_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~20..HEAD' }}
        run: node scripts/hygiene.mjs
      - name: Licences
        run: pnpm licenses:check
      - name: Wiki parity
        # The project wiki keeps pace with the tool: every check, page slot, active type,
        # configuration key and check family has its note in the demonstration repositories.
        run: |
          for name in demo-glossary demo-specs demo-briefs demo-wiki; do
            git clone --quiet --depth 1 --branch main "https://github.com/concordance-wiki/$name.git" "$RUNNER_TEMP/demo/$name"
          done
          DEMO_ROOT="$RUNNER_TEMP/demo" node scripts/parity.mjs
  windows:
    # The packages run wherever Node.js runs: the command line, its tests on the minimal corpus
    # and the golden-corpus build are exercised on Windows, so that the registry's users on that
    # platform are not the ones finding out.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Command line on the fixtures
        run: node packages/cli/dist/bin.js build --config fixtures/corpora/minimal/en/concordance.yaml --output dist-windows
      - name: Tests of the command line and the core
        run: pnpm exec vitest run packages/core packages/cli --coverage.enabled=false
  mutation:
    # A pull request mutates only the source files it changed, next to the other checks rather
    # than after them; the whole tree is mutated every night by the mutation workflow. The run
    # starts from the incremental file of the branch, or from the merged nightly one, so that
    # only the mutants whose code or tests changed are tested again.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore the merged nightly incremental file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental/main.json
          key: mutation-incremental-main-${{ github.run_id }}
          restore-keys: mutation-incremental-main-
      - name: Restore the incremental file of the branch
        # Keys are immutable: every run saves a new one and the next restores the latest.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental/branch.json
          key: mutation-incremental-branch-${{ github.head_ref }}-${{ github.run_id }}
          restore-keys: mutation-incremental-branch-${{ github.head_ref }}-
      - name: Mutation testing of the changed files
        run: node scripts/mutation.mjs --since origin/${{ github.event.pull_request.base.ref }}
      - name: Save the incremental file of the branch
        if: always() && hashFiles('reports/mutation/incremental/branch.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental/branch.json
          key: mutation-incremental-branch-${{ github.head_ref }}-${{ github.run_id }}
