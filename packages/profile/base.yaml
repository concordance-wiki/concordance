# Base of the default profile of Concordance: everything but the types.
#
# The engine knows nothing about screens, rules or glossaries: it reads the
# profile. The types live as modules under types/<slug>/ (type.yaml, messages,
# template); scripts/assemble-profile.mjs merges them into default.yaml, the
# file the package loads, and scripts/validate.mjs fails when the two drift.
# A project profile is merged on top of the assembled profile key by key.
#
# Validated by packages/core/schemas/profile.schema.json once assembled.

profile: default
version: 1

groups:
  container: { label: { en: Containers, fr: Conteneurs } }
  business: { label: { en: Business, fr: Métier } }
  application: { label: { en: Application, fr: Applicatif } }
  motivation: { label: { en: Motivation, fr: Motivation } }
  implementation: { label: { en: Implementation, fr: Réalisation } }
  quality: { label: { en: Quality, fr: Qualité } }
  raw: { label: { en: Raw sources, fr: Sources brutes } }

# Attributes every entity carries, whatever its type.
common_attributes:
  id: { type: string }
  type: { type: string }
  title: { type: string }
  aliases: { type: "string[]" }
  application: { type: ref, target: application }
  domain: { type: ref, target: domain }
  status: { type: enum, values: [draft, proposed, valid, obsolete], default: valid }
  tags: { type: "string[]" }
  summary: { type: string }
  superseded_by: { type: ref, target: same }
  locale: { type: enum, values: [en, fr] }

relations:
  composes:
    label: { en: composes, fr: compose }
    inverse_label: { en: is part of, fr: fait partie de }
    directed: true
    allowed:
      - [application, screen]
      - [application, api]
      - [application, process]
      - [application, batch]
      - [application, channel]
  assigned_to:
    label: { en: is assigned to, fr: est affecté à }
    inverse_label: { en: involves, fr: mobilise }
    directed: true
    allowed:
      - [role, process]
      - [role, screen]
      - [actor, role]
  realizes:
    label: { en: realizes, fr: réalise }
    inverse_label: { en: is realized by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [process, business_service]
      - [function, business_service]
  serves:
    label: { en: serves, fr: sert }
    inverse_label: { en: is served by, fr: est servi par }
    directed: true
    allowed:
      - [api, screen]
      - [api, process]
      - [api, batch]
      - [endpoint, screen]
      - [screen, process]
  exposes:
    label: { en: exposes, fr: expose }
    inverse_label: { en: is exposed by, fr: est exposé par }
    directed: true
    allowed:
      - [api, endpoint]
  accesses:
    label: { en: accesses, fr: accède à }
    inverse_label: { en: is accessed by, fr: est accédé par }
    directed: true
    attributes:
      mode: { type: enum, values: [read, write, create, delete] }
    allowed:
      - [screen, business_object]
      - [screen, data_object]
      - [api, business_object]
      - [api, data_object]
      - [endpoint, business_object]
      - [batch, business_object]
      - [batch, data_object]
      - [function, business_object]
      - [function, data_object]
  triggers:
    label: { en: triggers, fr: déclenche }
    inverse_label: { en: is triggered by, fr: est déclenché par }
    directed: true
    attributes:
      condition: { type: string }
      label: { type: string }
    allowed:
      - [business_event, process]
      - [screen, screen]
      - [milestone, work_package]
  flows_to:
    label: { en: flows to, fr: enchaîne vers }
    inverse_label: { en: follows, fr: fait suite à }
    directed: true
    attributes:
      object: { type: string }
    allowed:
      - [process, process]
      - [batch, batch]
  publishes:
    label: { en: publishes, fr: publie }
    inverse_label: { en: is published by, fr: est publié par }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [process, channel]
      - [api, channel]
      - [batch, channel]
      - [function, channel]
  subscribes:
    label: { en: subscribes to, fr: souscrit à }
    inverse_label: { en: has subscriber, fr: a pour abonné }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [process, channel]
      - [api, channel]
      - [batch, channel]
      - [function, channel]
  carries:
    label: { en: carries, fr: porte }
    inverse_label: { en: is carried by, fr: est porté par }
    directed: true
    status: planned
    allowed:
      - [message, business_event]
      - [representation, business_object]
  constrains:
    label: { en: constrains, fr: contraint }
    inverse_label: { en: is constrained by, fr: est contraint par }
    directed: true
    allowed:
      - [rule, screen]
      - [rule, process]
      - [rule, business_object]
      - [rule, api]
      - [rule, endpoint]
      - [constraint, requirement]
  represents:
    label: { en: represents, fr: représente }
    inverse_label: { en: is represented by, fr: est représenté par }
    directed: true
    allowed:
      - [data_object, business_object]
      - [term, business_object]
  specializes:
    label: { en: specializes, fr: spécialise }
    inverse_label: { en: generalizes, fr: généralise }
    directed: true
    allowed:
      - [term, term]
      - [business_object, business_object]
  affects:
    label: { en: affects, fr: affecte }
    inverse_label: { en: is affected by, fr: est affecté par }
    directed: true
    allowed:
      - [decision, any]
  documents:
    label: { en: documents, fr: documente }
    inverse_label: { en: is documented by, fr: est documenté par }
    directed: true
    allowed:
      - [document, any]
      - [meeting, any]
  covers:
    label: { en: covers, fr: couvre }
    inverse_label: { en: is covered by, fr: est couvert par }
    directed: true
    status: planned
    attributes:
      level: { type: string }
    allowed:
      - [test, process]
      - [test, screen]
      - [test, api]
      - [test, rule]
      - [test, requirement]
  implements:
    label: { en: implements, fr: réalise }
    inverse_label: { en: is implemented by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [backlog_item, requirement]
      - [backlog_item, decision]
      - [backlog_item, screen]
      - [backlog_item, api]
  applies_to:
    label: { en: applies to, fr: s'applique à }
    inverse_label: { en: is subject to, fr: est soumis à }
    directed: true
    status: planned
    target_kind: type
    allowed:
      - [standard, type]
  supersedes:
    label: { en: supersedes, fr: remplace }
    inverse_label: { en: is superseded by, fr: est remplacé par }
    directed: true
    attributes:
      date: { type: date }
    allowed:
      - [any, same]
  related:
    label: { en: is related to, fr: est lié à }
    directed: false
    cap: 0.6
    allowed:
      - [any, any]

confidence:
  explicit_link: 1.0
  lock_promoted: 1.0
  contract_import: 0.95
  frontmatter_ref: 0.9
  folder_zone: 0.9
  section_mention: 0.7
  glossary_occurrence:
    base: 0.6
    per_occurrence: 0.05
    cap: 0.8
    homonym_factor: 0.5
    type_prefix_bonus: 0.1
  cooccurrence: 0.4
  embedding: 0.25

# Words that announce the type of the entity that follows, per locale.
type_prefixes:
  en:
    screen: [screen, page]
    api: [api, service]
    data_object: [table]
    batch: [batch, job]
    rule: [rule]
    process: [process]
  fr:
    screen: [écran, page]
    api: [api, service]
    data_object: [table]
    batch: [batch, traitement]
    rule: [règle]
    process: [processus]
