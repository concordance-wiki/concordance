# Default profile of Concordance.
#
# The engine knows nothing about screens, rules or payments: it reads this file.
# A project profile is merged on top of it key by key. Types marked
# `status: planned` are part of the meta-model but not yet rendered by the
# first version; a project may enable them without any code change.
#
# Validated by packages/core/schemas/profile.schema.json.

profile: default
version: 1

groups:
  container: { label: { en: Containers, fr: Conteneurs } }
  business: { label: { en: Business, fr: Métier } }
  application: { label: { en: Application, fr: Applicatif } }
  motivation: { label: { en: Motivation, fr: Motivation } }
  implementation: { label: { en: Implementation, fr: Réalisation } }
  quality: { label: { en: Quality, fr: Qualité } }
  raw: { label: { en: Raw sources, fr: Sources brutes } }

# Attributes every entity carries, whatever its type.
common_attributes:
  id: { type: string }
  type: { type: string }
  title: { type: string }
  aliases: { type: "string[]" }
  application: { type: ref, target: application }
  domain: { type: ref, target: domain }
  status: { type: enum, values: [draft, proposed, valid, obsolete], default: valid }
  tags: { type: "string[]" }
  summary: { type: string }
  superseded_by: { type: ref, target: same }
  locale: { type: enum, values: [en, fr] }

types:
  application:
    label: { en: Application, fr: Application }
    group: container
    status: active
    glyph: application
    attributes:
      code: { type: string }
      owner: { type: string }
      status: { type: enum, values: [active, legacy, target] }
      plateau: { type: ref, target: plateau }
    display:
      highlight: [code, status, owner]
      neighbours_order: [screen, api, process, batch]

  domain:
    label: { en: Domain, fr: Domaine }
    group: container
    status: active
    glyph: domain
    attributes:
      parent: { type: ref, target: domain }
    display:
      highlight: [parent]

  actor:
    label: { en: Actor, fr: Acteur }
    group: business
    status: planned
    glyph: actor
    attributes:
      external: { type: boolean }

  role:
    label: { en: Role, fr: Rôle }
    group: business
    status: active
    glyph: role
    attributes:
      actors: { type: "ref[]", target: actor }
    display:
      highlight: [actors]
      neighbours_order: [process, screen]

  process:
    label: { en: Process, fr: Processus }
    group: business
    status: active
    glyph: process
    attributes:
      execution: { type: enum, values: [human, service, mixed, scheduled] }
      triggers: { type: "string[]" }
      steps: { type: list }
    sections:
      steps:
        heading: { en: Steps, fr: Étapes }
        parse: ordered-list
        produces: related
    display:
      highlight: [execution, triggers]
      neighbours_order: [role, screen, api, business_object, rule]

  business_event:
    label: { en: Business event, fr: Événement métier }
    group: business
    status: planned
    glyph: event
    attributes:
      nature: { type: enum, values: [business, technical, temporal] }

  business_service:
    label: { en: Business service, fr: Service métier }
    group: business
    status: planned
    glyph: service

  business_object:
    label: { en: Business object, fr: Objet métier }
    group: business
    status: active
    glyph: object
    attributes:
      attributes: { type: "string[]" }
      lifecycle: { type: "string[]" }
    display:
      highlight: [lifecycle]
      neighbours_order: [screen, api, batch, data_object, rule, term]

  rule:
    label: { en: Business rule, fr: Règle de gestion }
    group: business
    status: active
    glyph: rule
    attributes:
      severity: { type: string }
      condition: { type: string }
      applies_to: { type: "ref[]", target: [screen, process, business_object, api], relation: constrains }
    sections:
      applies_to:
        heading: { en: Applies to, fr: S'applique à }
        parse: bullet-list
        produces: constrains
    display:
      highlight: [severity, condition]
      neighbours_order: [screen, process, api, business_object, decision]

  term:
    label: { en: Term, fr: Terme }
    group: business
    status: active
    glyph: term
    attributes:
      broader: { type: ref, target: term, relation: specializes }
      narrower: { type: "ref[]", target: term }
      synonyms: { type: "string[]" }
      definition: { type: string }
    display:
      highlight: [aliases, broader]
      neighbours_order: [term, business_object, screen, rule]

  representation:
    label: { en: Representation, fr: Représentation }
    group: business
    status: planned
    glyph: document
    attributes:
      format: { type: string }
      channel: { type: string }

  screen:
    label: { en: Screen, fr: Écran }
    group: application
    status: active
    glyph: screen
    attributes:
      roles: { type: "ref[]", target: role, relation: assigned_to, inverse: true }
      reads: { type: "ref[]", target: [business_object, data_object], relation: accesses, attributes: { mode: read } }
      writes: { type: "ref[]", target: [business_object, data_object], relation: accesses, attributes: { mode: write } }
      actions: { type: list, schema: { label: string, to: ref, condition: ref } }
      rules: { type: "ref[]", target: rule, relation: constrains, inverse: true }
      url_pattern: { type: string }
    sections:
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
      actions:
        heading: { en: Actions, fr: Actions }
        parse: ordered-list
        produces: triggers
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [roles, url_pattern, status]
      neighbours_order: [business_object, data_object, screen, api, rule, process]

  api:
    label: { en: API, fr: API }
    group: application
    status: active
    glyph: api
    attributes:
      protocol: { type: enum, values: [rest, soap, graphql, grpc] }
      exposure: { type: enum, values: [apim, direct, internal] }
      contract: { type: string }
      consumers: { type: "ref[]", target: [screen, process, batch], relation: serves }
      objects: { type: "ref[]", target: [business_object, data_object], relation: accesses }
      version: { type: string }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
    display:
      highlight: [protocol, exposure, version, status, contract]
      neighbours_order: [endpoint, screen, business_object, rule, decision]

  endpoint:
    label: { en: Operation, fr: Opération }
    group: application
    status: active
    glyph: endpoint
    attributes:
      method: { type: string }
      path: { type: string }
      api: { type: ref, target: api }
      operation_id: { type: string }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [method, path]
      neighbours_order: [screen, rule, business_object]

  function:
    label: { en: Application function, fr: Fonction applicative }
    group: application
    status: planned
    glyph: function
    attributes:
      execution: { type: string }
      triggers: { type: "string[]" }

  batch:
    label: { en: Batch, fr: Batch }
    group: application
    status: active
    glyph: batch
    attributes:
      schedule: { type: string }
      window: { type: string }
      depends_on: { type: "ref[]", target: batch, relation: flows_to, inverse: true }
      reads: { type: "ref[]", target: [business_object, data_object], relation: accesses, attributes: { mode: read } }
      writes: { type: "ref[]", target: [business_object, data_object], relation: accesses, attributes: { mode: write } }
    sections:
      reads:
        heading: { en: Reads, fr: Lit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: read }
      writes:
        heading: { en: Writes, fr: Écrit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: write }
    display:
      highlight: [schedule, window]
      neighbours_order: [data_object, business_object, batch]

  channel:
    label: { en: Channel, fr: Canal }
    group: application
    status: planned
    glyph: channel
    attributes:
      technology: { type: string }
      guarantee: { type: string }
      owner: { type: string }

  message:
    label: { en: Message, fr: Message }
    group: application
    status: planned
    glyph: message
    attributes:
      schema: { type: string }
      carries: { type: ref, target: business_event }
      objects: { type: "ref[]", target: business_object }

  application_event:
    label: { en: Application event, fr: Événement applicatif }
    group: application
    status: planned
    glyph: event
    attributes:
      channel: { type: ref, target: channel }

  data_object:
    label: { en: Data object, fr: Objet de données }
    group: application
    status: active
    glyph: table
    attributes:
      business_object: { type: ref, target: business_object, relation: represents }
      fields: { type: "string[]" }
      schema: { type: string }
    display:
      highlight: [business_object, schema]
      neighbours_order: [business_object, batch, api, screen]

  goal:
    label: { en: Goal, fr: Objectif }
    group: motivation
    status: planned
    glyph: goal

  requirement:
    label: { en: Requirement, fr: Exigence }
    group: motivation
    status: planned
    glyph: requirement
    attributes:
      priority: { type: string }
      origin: { type: string }

  constraint:
    label: { en: Constraint, fr: Contrainte }
    group: motivation
    status: planned
    glyph: constraint
    attributes:
      origin: { type: string }

  principle:
    label: { en: Principle, fr: Principe }
    group: motivation
    status: planned
    glyph: principle

  decision:
    label: { en: Decision, fr: Décision }
    group: motivation
    status: active
    glyph: decision
    attributes:
      date: { type: date }
      nature: { type: enum, values: [functional, technical] }
      status: { type: enum, values: [proposed, accepted, superseded] }
      affects: { type: "ref[]", target: any, relation: affects }
      supersedes: { type: ref, target: decision, relation: supersedes }
    sections:
      affects:
        heading: { en: Affects, fr: Affecte }
        parse: bullet-list
        produces: affects
    display:
      highlight: [date, nature, status]
      neighbours_order: [screen, api, rule, process, business_object, meeting]

  standard:
    label: { en: Standard, fr: Norme }
    group: motivation
    status: planned
    glyph: standard
    attributes:
      applies_to_types: { type: "string[]" }
      mandatory: { type: boolean }
      version: { type: string }

  work_package:
    label: { en: Work package, fr: Lot }
    group: implementation
    status: planned
    glyph: package
    attributes:
      start: { type: date }
      end: { type: date }
      deliverables: { type: "string[]" }

  backlog_item:
    label: { en: Backlog item, fr: Item de backlog }
    group: implementation
    status: planned
    glyph: item
    attributes:
      ref: { type: string }
      tool: { type: string }
      status: { type: string }
      work_package: { type: ref, target: work_package }
      affects: { type: "ref[]", target: any, relation: implements }
      requirement: { type: ref, target: requirement, relation: implements }

  milestone:
    label: { en: Milestone, fr: Jalon }
    group: implementation
    status: planned
    glyph: milestone
    attributes:
      date: { type: date }

  plateau:
    label: { en: Plateau, fr: Plateau }
    group: implementation
    status: planned
    glyph: plateau
    attributes:
      date: { type: date }
      applications: { type: "ref[]", target: application }

  gap:
    label: { en: Gap, fr: Écart }
    group: implementation
    status: planned
    glyph: gap
    attributes:
      from: { type: ref, target: plateau }
      to: { type: ref, target: plateau }

  test_strategy:
    label: { en: Test strategy, fr: Stratégie de test }
    group: quality
    status: planned
    glyph: strategy
    attributes:
      applies_to: { type: "ref[]", target: any }
      levels: { type: "string[]" }

  test:
    label: { en: Test, fr: Test }
    group: quality
    status: planned
    glyph: test
    attributes:
      level: { type: string }
      automated: { type: boolean }
      covers: { type: "ref[]", target: [process, screen, api, rule, requirement], relation: covers }
      ref: { type: string }

  document:
    label: { en: Document, fr: Document }
    group: raw
    status: active
    glyph: document
    graph: documents-only
    attributes:
      format: { type: string }
      author: { type: string }
      date: { type: date }
      pages: { type: integer }
      duration: { type: string }
      representations: { type: "string[]" }
      preview_available: { type: boolean }
      source: { type: string }
    display:
      highlight: [format, date, author]

  meeting:
    label: { en: Meeting, fr: Réunion }
    group: raw
    status: active
    glyph: meeting
    graph: documents-only
    attributes:
      date: { type: date }
      participants: { type: "string[]" }
      decisions: { type: "ref[]", target: decision }
      duration: { type: string }
    display:
      highlight: [date, duration, participants]
      neighbours_order: [decision, term, screen, api]

relations:
  composes:
    label: { en: composes, fr: compose }
    directed: true
    allowed:
      - [application, screen]
      - [application, api]
      - [application, process]
      - [application, batch]
      - [application, channel]
  assigned_to:
    label: { en: is assigned to, fr: est affecté à }
    directed: true
    allowed:
      - [role, process]
      - [role, screen]
      - [actor, role]
  realizes:
    label: { en: realizes, fr: réalise }
    directed: true
    status: planned
    allowed:
      - [process, business_service]
      - [function, business_service]
  serves:
    label: { en: serves, fr: sert }
    directed: true
    allowed:
      - [api, screen]
      - [api, process]
      - [api, batch]
      - [endpoint, screen]
      - [screen, process]
  exposes:
    label: { en: exposes, fr: expose }
    directed: true
    allowed:
      - [api, endpoint]
  accesses:
    label: { en: accesses, fr: accède à }
    directed: true
    attributes:
      mode: { type: enum, values: [read, write, create, delete] }
    allowed:
      - [screen, business_object]
      - [screen, data_object]
      - [api, business_object]
      - [api, data_object]
      - [endpoint, business_object]
      - [batch, business_object]
      - [batch, data_object]
      - [function, business_object]
      - [function, data_object]
  triggers:
    label: { en: triggers, fr: déclenche }
    directed: true
    attributes:
      condition: { type: string }
      label: { type: string }
    allowed:
      - [business_event, process]
      - [screen, screen]
      - [milestone, work_package]
  flows_to:
    label: { en: flows to, fr: enchaîne vers }
    directed: true
    attributes:
      object: { type: string }
    allowed:
      - [process, process]
      - [batch, batch]
  publishes:
    label: { en: publishes, fr: publie }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [process, channel]
      - [api, channel]
      - [batch, channel]
      - [function, channel]
  subscribes:
    label: { en: subscribes to, fr: souscrit à }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [process, channel]
      - [api, channel]
      - [batch, channel]
      - [function, channel]
  carries:
    label: { en: carries, fr: porte }
    directed: true
    status: planned
    allowed:
      - [message, business_event]
      - [representation, business_object]
  constrains:
    label: { en: constrains, fr: contraint }
    directed: true
    allowed:
      - [rule, screen]
      - [rule, process]
      - [rule, business_object]
      - [rule, api]
      - [rule, endpoint]
      - [constraint, requirement]
  represents:
    label: { en: represents, fr: représente }
    directed: true
    allowed:
      - [data_object, business_object]
      - [term, business_object]
  specializes:
    label: { en: specializes, fr: spécialise }
    directed: true
    allowed:
      - [term, term]
      - [business_object, business_object]
  affects:
    label: { en: affects, fr: affecte }
    directed: true
    allowed:
      - [decision, any]
  documents:
    label: { en: documents, fr: documente }
    directed: true
    allowed:
      - [document, any]
      - [meeting, any]
  covers:
    label: { en: covers, fr: couvre }
    directed: true
    status: planned
    attributes:
      level: { type: string }
    allowed:
      - [test, process]
      - [test, screen]
      - [test, api]
      - [test, rule]
      - [test, requirement]
  implements:
    label: { en: implements, fr: réalise }
    directed: true
    status: planned
    allowed:
      - [backlog_item, requirement]
      - [backlog_item, decision]
      - [backlog_item, screen]
      - [backlog_item, api]
  applies_to:
    label: { en: applies to, fr: s'applique à }
    directed: true
    status: planned
    target_kind: type
    allowed:
      - [standard, type]
  supersedes:
    label: { en: supersedes, fr: remplace }
    directed: true
    attributes:
      date: { type: date }
    allowed:
      - [any, same]
  related:
    label: { en: is related to, fr: est lié à }
    directed: false
    cap: 0.6
    allowed:
      - [any, any]

confidence:
  explicit_link: 1.0
  lock_promoted: 1.0
  contract_import: 0.95
  frontmatter_ref: 0.9
  folder_zone: 0.9
  section_mention: 0.7
  glossary_occurrence:
    base: 0.6
    per_occurrence: 0.05
    cap: 0.8
    homonym_factor: 0.5
    type_prefix_bonus: 0.1
  cooccurrence: 0.4
  embedding: 0.25

# Words that announce the type of the entity that follows, per locale.
type_prefixes:
  en:
    screen: [screen, page]
    api: [api, service]
    data_object: [table]
    batch: [batch, job]
    rule: [rule]
    process: [process]
  fr:
    screen: [écran, page]
    api: [api, service]
    data_object: [table]
    batch: [batch, traitement]
    rule: [règle]
    process: [processus]
