# Default profile of Concordance.
#
# GENERATED by scripts/assemble-profile.mjs from base.yaml and the type
# modules under types/<slug>/: edit those, then run the script. The engine
# knows nothing about screens, rules or glossaries: it reads this file.
# A project profile is merged on top of it key by key. Types marked
# `status: planned` are part of the meta-model but not yet rendered by the
# first version; a project may enable them without any code change.
#
# Validated by packages/core/schemas/profile.schema.json.

profile: default
version: 1

groups:
  container: { label: { en: Containers, fr: Conteneurs } }
  business: { label: { en: Business, fr: Métier } }
  application: { label: { en: Application, fr: Applicatif } }
  motivation: { label: { en: Motivation, fr: Motivation } }
  implementation: { label: { en: Implementation, fr: Réalisation } }
  quality: { label: { en: Quality, fr: Qualité } }
  raw: { label: { en: Raw sources, fr: Sources brutes } }

# Attributes every entity carries, whatever its type.
common_attributes:
  id: { type: string }
  type: { type: string }
  title: { type: string }
  aliases: { type: "string[]" }
  application: { type: ref, target: application }
  domain: { type: ref, target: domain }
  status: { type: enum, values: [ draft, proposed, valid, obsolete ], default: valid }
  tags: { type: "string[]" }
  summary: { type: string }
  superseded_by: { type: ref, target: same }
  locale: { type: enum, values: [ en, fr ] }

types:
  actor:
    label: { en: Actor, fr: Acteur }
    group: business
    status: planned
    glyph: actor
    attributes:
      external: { type: boolean, label: { en: External, fr: Externe } }

  api:
    label: { en: API, fr: API }
    group: application
    status: active
    glyph: api
    attributes:
      protocol: { type: enum, values: [ rest, soap, graphql, grpc ], label: { en: Protocol, fr: Protocole } }
      exposure: { type: enum, values: [ apim, direct, internal ], label: { en: Exposure, fr: Exposition } }
      contract: { type: string, label: { en: Contract, fr: Contrat } }
      consumers: { type: "ref[]", target: [ screen, process, batch ], relation: serves, label: { en: Consumers, fr: Consommateurs } }
      objects: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, label: { en: Objects, fr: Objets } }
      version: { type: string, label: { en: Version, fr: Version } }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
    display:
      highlight: [ protocol, exposure, version, status, contract ]
      neighbours_order: [ endpoint, screen, business_object, rule, decision ]

  application:
    label: { en: Application, fr: Application }
    group: container
    status: active
    glyph: application
    attributes:
      code: { type: string, label: { en: Code, fr: Code } }
      owner: { type: string, label: { en: Owner, fr: Responsable } }
      status: { type: enum, values: [ active, legacy, target ], label: { en: Status, fr: Statut } }
      plateau: { type: ref, target: plateau, label: { en: Plateau, fr: Plateau } }
    display:
      highlight: [ code, status, owner ]
      neighbours_order: [ screen, api, process, batch ]

  application_event:
    label: { en: Application event, fr: Événement applicatif }
    group: application
    status: planned
    glyph: event
    attributes:
      channel: { type: ref, target: channel, label: { en: Channel, fr: Canal } }

  backlog_item:
    label: { en: Backlog item, fr: Item de backlog }
    group: implementation
    status: planned
    glyph: item
    attributes:
      ref: { type: string, label: { en: Reference, fr: Référence } }
      tool: { type: string, label: { en: Tool, fr: Outil } }
      status: { type: string, label: { en: Status, fr: Statut } }
      work_package: { type: ref, target: work_package, label: { en: Work package, fr: Lot } }
      affects: { type: "ref[]", target: any, relation: implements, label: { en: Affects, fr: Affecte } }
      requirement: { type: ref, target: requirement, relation: implements, label: { en: Requirement, fr: Exigence } }

  batch:
    label: { en: Batch, fr: Batch }
    group: application
    status: active
    glyph: batch
    attributes:
      schedule: { type: string, label: { en: Schedule, fr: Planification } }
      window: { type: string, label: { en: Window, fr: Fenêtre } }
      depends_on: { type: "ref[]", target: batch, relation: flows_to, inverse: true, label: { en: Depends on, fr: Dépend de } }
      reads: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: read }, label: { en: Reads, fr: Lit } }
      writes: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: write }, label: { en: Writes, fr: Écrit } }
    sections:
      reads:
        heading: { en: Reads, fr: Lit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: read }
      writes:
        heading: { en: Writes, fr: Écrit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: write }
    display:
      highlight: [ schedule, window ]
      neighbours_order: [ data_object, business_object, batch ]

  business_event:
    label: { en: Business event, fr: Événement métier }
    group: business
    status: planned
    glyph: event
    attributes:
      nature: { type: enum, values: [ business, technical, temporal ], label: { en: Nature, fr: Nature } }

  business_object:
    label: { en: Business object, fr: Objet métier }
    group: business
    status: active
    glyph: object
    attributes:
      attributes: { type: "string[]", label: { en: Attributes, fr: Attributs } }
      lifecycle: { type: "string[]", label: { en: Lifecycle, fr: Cycle de vie } }
    display:
      highlight: [ lifecycle ]
      neighbours_order: [ screen, api, batch, data_object, rule, term ]

  business_service:
    label: { en: Business service, fr: Service métier }
    group: business
    status: planned
    glyph: service

  channel:
    label: { en: Channel, fr: Canal }
    group: application
    status: planned
    glyph: channel
    attributes:
      technology: { type: string, label: { en: Technology, fr: Technologie } }
      guarantee: { type: string, label: { en: Guarantee, fr: Garantie } }
      owner: { type: string, label: { en: Owner, fr: Responsable } }

  constraint:
    label: { en: Constraint, fr: Contrainte }
    group: motivation
    status: planned
    glyph: constraint
    attributes:
      origin: { type: string, label: { en: Origin, fr: Origine } }

  data_object:
    label: { en: Data object, fr: Objet de données }
    group: application
    status: active
    glyph: table
    attributes:
      business_object: { type: ref, target: business_object, relation: represents, label: { en: Business object, fr: Objet métier } }
      fields: { type: "string[]", label: { en: Fields, fr: Champs } }
      schema: { type: string, label: { en: Schema, fr: Schéma } }
    display:
      highlight: [ business_object, schema ]
      neighbours_order: [ business_object, batch, api, screen ]

  decision:
    label: { en: Decision, fr: Décision }
    group: motivation
    status: active
    glyph: decision
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      nature: { type: enum, values: [ functional, technical ], label: { en: Nature, fr: Nature } }
      status: { type: enum, values: [ proposed, accepted, superseded ], label: { en: Status, fr: Statut } }
      affects: { type: "ref[]", target: any, relation: affects, label: { en: Affects, fr: Affecte } }
      supersedes: { type: ref, target: decision, relation: supersedes, label: { en: Supersedes, fr: Remplace } }
    sections:
      affects:
        heading: { en: Affects, fr: Affecte }
        parse: bullet-list
        produces: affects
    display:
      highlight: [ date, nature, status ]
      neighbours_order: [ screen, api, rule, process, business_object, meeting ]

  document:
    label: { en: Document, fr: Document }
    group: raw
    status: active
    glyph: document
    graph: documents-only
    attributes:
      format: { type: string, label: { en: Format, fr: Format } }
      author: { type: string, label: { en: Author, fr: Auteur } }
      date: { type: date, label: { en: Date, fr: Date } }
      pages: { type: integer, label: { en: Pages, fr: Pages } }
      duration: { type: string, label: { en: Duration, fr: Durée } }
      representations: { type: "string[]", label: { en: Representations, fr: Représentations } }
      preview_available: { type: boolean, label: { en: Preview available, fr: Aperçu disponible } }
      source: { type: string, label: { en: Source, fr: Source } }
    display:
      highlight: [ format, date, author ]

  domain:
    label: { en: Domain, fr: Domaine }
    group: container
    status: active
    glyph: domain
    attributes:
      parent: { type: ref, target: domain, label: { en: Parent, fr: Parent } }
    display:
      highlight: [ parent ]

  endpoint:
    label: { en: Operation, fr: Opération }
    group: application
    status: active
    glyph: endpoint
    attributes:
      method: { type: string, label: { en: Method, fr: Méthode } }
      path: { type: string, label: { en: Path, fr: Chemin } }
      api: { type: ref, target: api, label: { en: API, fr: API } }
      operation_id: { type: string, label: { en: Operation id, fr: Identifiant d'opération } }
      style: { type: enum, values: [ http, soap ], label: { en: Style, fr: Style } }
      port: { type: string, label: { en: Port, fr: Port } }
      binding: { type: string, label: { en: Binding, fr: Binding } }
      soap_action: { type: string, label: { en: SOAP action, fr: Action SOAP } }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [ method, path ]
      neighbours_order: [ screen, rule, business_object ]

  function:
    label: { en: Application function, fr: Fonction applicative }
    group: application
    status: planned
    glyph: function
    attributes:
      execution: { type: string, label: { en: Execution, fr: Exécution } }
      triggers: { type: "string[]", label: { en: Triggers, fr: Déclencheurs } }

  gap:
    label: { en: Gap, fr: Écart }
    group: implementation
    status: planned
    glyph: gap
    attributes:
      from: { type: ref, target: plateau, label: { en: From, fr: De } }
      to: { type: ref, target: plateau, label: { en: To, fr: Vers } }

  goal:
    label: { en: Goal, fr: Objectif }
    group: motivation
    status: planned
    glyph: goal

  meeting:
    label: { en: Meeting, fr: Réunion }
    group: raw
    status: active
    glyph: meeting
    graph: documents-only
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      participants: { type: "string[]", label: { en: Participants, fr: Participants } }
      decisions: { type: "ref[]", target: decision, relation: documents, label: { en: Decisions, fr: Décisions } }
      duration: { type: string, label: { en: Duration, fr: Durée } }
    display:
      highlight: [ date, duration, participants ]
      neighbours_order: [ decision, term, screen, api ]

  message:
    label: { en: Message, fr: Message }
    group: application
    status: planned
    glyph: message
    attributes:
      schema: { type: string, label: { en: Schema, fr: Schéma } }
      carries: { type: ref, target: business_event, label: { en: Carries, fr: Porte } }
      objects: { type: "ref[]", target: business_object, label: { en: Objects, fr: Objets } }

  milestone:
    label: { en: Milestone, fr: Jalon }
    group: implementation
    status: planned
    glyph: milestone
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }

  plateau:
    label: { en: Plateau, fr: Plateau }
    group: implementation
    status: planned
    glyph: plateau
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      applications: { type: "ref[]", target: application, label: { en: Applications, fr: Applications } }

  principle:
    label: { en: Principle, fr: Principe }
    group: motivation
    status: planned
    glyph: principle

  process:
    label: { en: Process, fr: Processus }
    group: business
    status: active
    glyph: process
    attributes:
      execution: { type: enum, values: [ human, service, mixed, scheduled ], label: { en: Execution, fr: Exécution } }
      triggers: { type: "string[]", label: { en: Triggers, fr: Déclencheurs } }
      steps: { type: list, label: { en: Steps, fr: Étapes } }
    sections:
      steps:
        heading: { en: Steps, fr: Étapes }
        parse: ordered-list
        produces: related
    display:
      highlight: [ execution, triggers ]
      neighbours_order: [ role, screen, api, business_object, rule ]

  representation:
    label: { en: Representation, fr: Représentation }
    group: business
    status: planned
    glyph: document
    attributes:
      format: { type: string, label: { en: Format, fr: Format } }
      channel: { type: string, label: { en: Channel, fr: Canal } }

  requirement:
    label: { en: Requirement, fr: Exigence }
    group: motivation
    status: planned
    glyph: requirement
    attributes:
      priority: { type: string, label: { en: Priority, fr: Priorité } }
      origin: { type: string, label: { en: Origin, fr: Origine } }

  role:
    label: { en: Role, fr: Rôle }
    group: business
    status: active
    glyph: role
    attributes:
      actors: { type: "ref[]", target: actor, label: { en: Actors, fr: Acteurs } }
    display:
      highlight: [ actors ]
      neighbours_order: [ process, screen ]

  rule:
    label: { en: Business rule, fr: Règle de gestion }
    group: business
    status: active
    glyph: rule
    attributes:
      severity: { type: string, label: { en: Severity, fr: Sévérité } }
      condition: { type: string, label: { en: Condition, fr: Condition } }
      applies_to: { type: "ref[]", target: [ screen, process, business_object, api ], relation: constrains, label: { en: Applies to, fr: S'applique à } }
    sections:
      applies_to:
        heading: { en: Applies to, fr: S'applique à }
        parse: bullet-list
        produces: constrains
    display:
      highlight: [ severity, condition ]
      neighbours_order: [ screen, process, api, business_object, decision ]

  screen:
    label: { en: Screen, fr: Écran }
    group: application
    status: active
    glyph: screen
    attributes:
      roles: { type: "ref[]", target: role, relation: assigned_to, inverse: true, label: { en: Roles, fr: Rôles } }
      reads: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: read }, label: { en: Reads, fr: Lit } }
      writes: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: write }, label: { en: Writes, fr: Écrit } }
      actions: { type: list, schema: { label: string, to: ref, condition: ref }, label: { en: Actions, fr: Actions } }
      rules: { type: "ref[]", target: rule, relation: constrains, inverse: true, label: { en: Rules, fr: Règles } }
      url_pattern: { type: string, label: { en: URL pattern, fr: Motif d'URL } }
    sections:
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
      actions:
        heading: { en: Actions, fr: Actions }
        parse: ordered-list
        produces: triggers
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [ roles, url_pattern, status ]
      neighbours_order: [ business_object, data_object, screen, api, rule, process ]

  standard:
    label: { en: Standard, fr: Norme }
    group: motivation
    status: planned
    glyph: standard
    attributes:
      applies_to_types: { type: "string[]", label: { en: Applies to types, fr: S'applique aux types } }
      mandatory: { type: boolean, label: { en: Mandatory, fr: Obligatoire } }
      version: { type: string, label: { en: Version, fr: Version } }

  term:
    label: { en: Term, fr: Terme }
    group: business
    status: active
    glyph: term
    attributes:
      broader: { type: ref, target: term, relation: specializes, label: { en: Broader term, fr: Terme générique } }
      narrower: { type: "ref[]", target: term, label: { en: Narrower terms, fr: Termes spécifiques } }
      synonyms: { type: "string[]", label: { en: Synonyms, fr: Synonymes } }
      definition: { type: string, label: { en: Definition, fr: Définition } }
    display:
      highlight: [ aliases, broader ]
      neighbours_order: [ term, business_object, screen, rule ]

  test:
    label: { en: Test, fr: Test }
    group: quality
    status: planned
    glyph: test
    attributes:
      level: { type: string, label: { en: Level, fr: Niveau } }
      automated: { type: boolean, label: { en: Automated, fr: Automatisé } }
      covers: { type: "ref[]", target: [ process, screen, api, rule, requirement ], relation: covers, label: { en: Covers, fr: Couvre } }
      ref: { type: string, label: { en: Reference, fr: Référence } }

  test_strategy:
    label: { en: Test strategy, fr: Stratégie de test }
    group: quality
    status: planned
    glyph: strategy
    attributes:
      applies_to: { type: "ref[]", target: any, label: { en: Applies to, fr: S'applique à } }
      levels: { type: "string[]", label: { en: Levels, fr: Niveaux } }

  work_package:
    label: { en: Work package, fr: Lot }
    group: implementation
    status: planned
    glyph: package
    attributes:
      start: { type: date, label: { en: Start, fr: Début } }
      end: { type: date, label: { en: End, fr: Fin } }
      deliverables: { type: "string[]", label: { en: Deliverables, fr: Livrables } }

relations:
  composes:
    label: { en: composes, fr: compose }
    inverse_label: { en: is part of, fr: fait partie de }
    directed: true
    allowed:
      - [ application, screen ]
      - [ application, api ]
      - [ application, process ]
      - [ application, batch ]
      - [ application, channel ]
  assigned_to:
    label: { en: is assigned to, fr: est affecté à }
    inverse_label: { en: involves, fr: mobilise }
    directed: true
    allowed:
      - [ role, process ]
      - [ role, screen ]
      - [ actor, role ]
  realizes:
    label: { en: realizes, fr: réalise }
    inverse_label: { en: is realized by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [ process, business_service ]
      - [ function, business_service ]
  serves:
    label: { en: serves, fr: sert }
    inverse_label: { en: is served by, fr: est servi par }
    directed: true
    allowed:
      - [ api, screen ]
      - [ api, process ]
      - [ api, batch ]
      - [ endpoint, screen ]
      - [ screen, process ]
  exposes:
    label: { en: exposes, fr: expose }
    inverse_label: { en: is exposed by, fr: est exposé par }
    directed: true
    allowed:
      - [ api, endpoint ]
  accesses:
    label: { en: accesses, fr: accède à }
    inverse_label: { en: is accessed by, fr: est accédé par }
    directed: true
    attributes:
      mode: { type: enum, values: [ read, write, create, delete ] }
    allowed:
      - [ screen, business_object ]
      - [ screen, data_object ]
      - [ api, business_object ]
      - [ api, data_object ]
      - [ endpoint, business_object ]
      - [ batch, business_object ]
      - [ batch, data_object ]
      - [ function, business_object ]
      - [ function, data_object ]
  triggers:
    label: { en: triggers, fr: déclenche }
    inverse_label: { en: is triggered by, fr: est déclenché par }
    directed: true
    attributes:
      condition: { type: string }
      label: { type: string }
    allowed:
      - [ business_event, process ]
      - [ screen, screen ]
      - [ milestone, work_package ]
  flows_to:
    label: { en: flows to, fr: enchaîne vers }
    inverse_label: { en: follows, fr: fait suite à }
    directed: true
    attributes:
      object: { type: string }
    allowed:
      - [ process, process ]
      - [ batch, batch ]
  publishes:
    label: { en: publishes, fr: publie }
    inverse_label: { en: is published by, fr: est publié par }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [ process, channel ]
      - [ api, channel ]
      - [ batch, channel ]
      - [ function, channel ]
  subscribes:
    label: { en: subscribes to, fr: souscrit à }
    inverse_label: { en: has subscriber, fr: a pour abonné }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [ process, channel ]
      - [ api, channel ]
      - [ batch, channel ]
      - [ function, channel ]
  carries:
    label: { en: carries, fr: porte }
    inverse_label: { en: is carried by, fr: est porté par }
    directed: true
    status: planned
    allowed:
      - [ message, business_event ]
      - [ representation, business_object ]
  constrains:
    label: { en: constrains, fr: contraint }
    inverse_label: { en: is constrained by, fr: est contraint par }
    directed: true
    allowed:
      - [ rule, screen ]
      - [ rule, process ]
      - [ rule, business_object ]
      - [ rule, api ]
      - [ rule, endpoint ]
      - [ constraint, requirement ]
  represents:
    label: { en: represents, fr: représente }
    inverse_label: { en: is represented by, fr: est représenté par }
    directed: true
    allowed:
      - [ data_object, business_object ]
      - [ term, business_object ]
  specializes:
    label: { en: specializes, fr: spécialise }
    inverse_label: { en: generalizes, fr: généralise }
    directed: true
    allowed:
      - [ term, term ]
      - [ business_object, business_object ]
  affects:
    label: { en: affects, fr: affecte }
    inverse_label: { en: is affected by, fr: est affecté par }
    directed: true
    allowed:
      - [ decision, any ]
  documents:
    label: { en: documents, fr: documente }
    inverse_label: { en: is documented by, fr: est documenté par }
    directed: true
    allowed:
      - [ document, any ]
      - [ meeting, any ]
  covers:
    label: { en: covers, fr: couvre }
    inverse_label: { en: is covered by, fr: est couvert par }
    directed: true
    status: planned
    attributes:
      level: { type: string }
    allowed:
      - [ test, process ]
      - [ test, screen ]
      - [ test, api ]
      - [ test, rule ]
      - [ test, requirement ]
  implements:
    label: { en: implements, fr: réalise }
    inverse_label: { en: is implemented by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [ backlog_item, requirement ]
      - [ backlog_item, decision ]
      - [ backlog_item, screen ]
      - [ backlog_item, api ]
  applies_to:
    label: { en: applies to, fr: s'applique à }
    inverse_label: { en: is subject to, fr: est soumis à }
    directed: true
    status: planned
    target_kind: type
    allowed:
      - [ standard, type ]
  supersedes:
    label: { en: supersedes, fr: remplace }
    inverse_label: { en: is superseded by, fr: est remplacé par }
    directed: true
    attributes:
      date: { type: date }
    allowed:
      - [ any, same ]
  related:
    label: { en: is related to, fr: est lié à }
    directed: false
    cap: 0.6
    allowed:
      - [ any, any ]

confidence:
  explicit_link: 1.0
  lock_promoted: 1.0
  contract_import: 0.95
  frontmatter_ref: 0.9
  folder_zone: 0.9
  section_mention: 0.7
  glossary_occurrence:
    base: 0.6
    per_occurrence: 0.05
    cap: 0.8
    homonym_factor: 0.5
    type_prefix_bonus: 0.1
  cooccurrence: 0.4
  embedding: 0.25

