# Default profile of Concordance.
#
# GENERATED by scripts/assemble-profile.mjs from base.yaml and the type
# modules under types/<slug>/: edit those, then run the script. The engine
# knows nothing about screens, rules or glossaries: it reads this file.
# A project profile is merged on top of it key by key. Types marked
# `status: planned` are part of the meta-model but not yet rendered by the
# first version; a project may enable them without any code change.
#
# Validated by packages/core/schemas/profile.schema.json.

profile: default
version: 1

groups:
  container: { label: { en: Containers, fr: Conteneurs } }
  business: { label: { en: Business, fr: Métier } }
  application: { label: { en: Application, fr: Applicatif } }
  motivation: { label: { en: Motivation, fr: Motivation } }
  implementation: { label: { en: Implementation, fr: Réalisation } }
  quality: { label: { en: Quality, fr: Qualité } }
  raw: { label: { en: Raw sources, fr: Sources brutes } }

# Attributes every entity carries, whatever its type.
common_attributes:
  id: { type: string }
  type: { type: string }
  title: { type: string }
  aliases: { type: "string[]" }
  application: { type: ref, target: application }
  domain: { type: ref, target: domain }
  status: { type: enum, values: [ draft, proposed, valid, obsolete ], default: valid }
  tags: { type: "string[]" }
  summary: { type: string }
  superseded_by: { type: ref, target: same }
  locale: { type: enum, values: [ en, fr ] }

types:
  actor:
    label: { en: Actor, fr: Acteur }
    description:
      en: An actor is a person, a team or a system that takes part in a process from outside the application.
      fr: Un acteur est une personne, une équipe ou un système qui prend part à un processus depuis l'extérieur de l'application.
    counted:
      en: "{count, plural, one {# actor described} other {# actors described}}"
      fr: "{count, plural, one {# acteur décrit} other {# acteurs décrits}}"
    group: business
    status: planned
    glyph: actor
    attributes:
      external: { type: boolean, label: { en: External, fr: Externe } }

  api:
    label: { en: API, fr: API }
    description:
      en: An API is a service the application exposes, with the operations its contract declares.
      fr: Une API est un service que l'application expose, avec les opérations que son contrat déclare.
    counted:
      en: "{count, plural, one {# API described} other {# APIs described}}"
      fr: "{count, plural, one {# API décrite} other {# API décrites}}"
    group: application
    status: active
    glyph: api
    attributes:
      protocol: { type: enum, values: [ rest, soap, graphql, grpc ], label: { en: Protocol, fr: Protocole } }
      exposure: { type: enum, values: [ apim, direct, internal ], label: { en: Exposure, fr: Exposition } }
      contract: { type: string, label: { en: Contract, fr: Contrat } }
      consumers: { type: "ref[]", target: [ screen, process, batch ], relation: serves, label: { en: Consumers, fr: Consommateurs } }
      objects: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, label: { en: Objects, fr: Objets } }
      version: { type: string, label: { en: Version, fr: Version } }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
    display:
      highlight: [ protocol, exposure, version, status, contract ]
      neighbours_order: [ endpoint, screen, business_object, rule, decision ]

  application:
    label: { en: Application, fr: Application }
    description:
      en: An application is a system the documentation describes, which files its screens, APIs and batches under it.
      fr: Une application est un système que la documentation décrit, qui range sous elle ses écrans, ses API et ses batchs.
    counted:
      en: "{count, plural, one {# application described} other {# applications described}}"
      fr: "{count, plural, one {# application décrite} other {# applications décrites}}"
    group: container
    status: active
    glyph: application
    attributes:
      code: { type: string, label: { en: Code, fr: Code } }
      owner: { type: string, label: { en: Owner, fr: Responsable } }
      status: { type: enum, values: [ active, legacy, target ], label: { en: Status, fr: Statut } }
      plateau: { type: ref, target: plateau, label: { en: Plateau, fr: Plateau } }
    display:
      highlight: [ code, status, owner ]
      neighbours_order: [ screen, api, process, batch ]

  application_event:
    label: { en: Application event, fr: Événement applicatif }
    description:
      en: An application event is something that happens inside the application and that other parts react to.
      fr: Un événement applicatif est quelque chose qui se produit dans l'application et auquel d'autres parties réagissent.
    counted:
      en: "{count, plural, one {# application event described} other {# application events described}}"
      fr: "{count, plural, one {# événement applicatif décrit} other {# événements applicatifs décrits}}"
    group: application
    status: planned
    glyph: event
    attributes:
      channel: { type: ref, target: channel, label: { en: Channel, fr: Canal } }

  backlog_item:
    label: { en: Backlog item, fr: Item de backlog }
    description:
      en: A backlog item is a piece of work waiting to be done, with what it changes.
      fr: Un item de backlog est un travail en attente, avec ce qu'il change.
    counted:
      en: "{count, plural, one {# backlog item described} other {# backlog items described}}"
      fr: "{count, plural, one {# item de backlog décrit} other {# items de backlog décrits}}"
    group: implementation
    status: planned
    glyph: item
    attributes:
      ref: { type: string, label: { en: Reference, fr: Référence } }
      tool: { type: string, label: { en: Tool, fr: Outil } }
      status: { type: string, label: { en: Status, fr: Statut } }
      work_package: { type: ref, target: work_package, label: { en: Work package, fr: Lot } }
      affects: { type: "ref[]", target: any, relation: implements, label: { en: Affects, fr: Affecte } }
      requirement: { type: ref, target: requirement, relation: implements, label: { en: Requirement, fr: Exigence } }

  batch:
    label: { en: Batch, fr: Batch }
    description:
      en: A batch is a treatment that runs on a schedule, with what it reads, what it writes and what it depends on.
      fr: Un batch est un traitement qui s'exécute à heure fixe, avec ce qu'il lit, ce qu'il écrit et ce dont il dépend.
    counted:
      en: "{count, plural, one {# batch described} other {# batches described}}"
      fr: "{count, plural, one {# batch décrit} other {# batchs décrits}}"
    group: application
    status: active
    glyph: batch
    attributes:
      schedule: { type: string, label: { en: Schedule, fr: Planification } }
      window: { type: string, label: { en: Window, fr: Fenêtre } }
      depends_on: { type: "ref[]", target: batch, relation: flows_to, inverse: true, label: { en: Depends on, fr: Dépend de } }
      reads: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: read }, label: { en: Reads, fr: Lit } }
      writes: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: write }, label: { en: Writes, fr: Écrit } }
    sections:
      reads:
        heading: { en: Reads, fr: Lit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: read }
      writes:
        heading: { en: Writes, fr: Écrit }
        parse: bullet-list
        produces: accesses
        attributes: { mode: write }
    display:
      highlight: [ schedule, window ]
      neighbours_order: [ data_object, business_object, batch ]

  business_event:
    label: { en: Business event, fr: Événement métier }
    description:
      en: A business event is something that happens in the business and that a process answers.
      fr: Un événement métier est quelque chose qui se produit dans le métier et auquel un processus répond.
    counted:
      en: "{count, plural, one {# business event described} other {# business events described}}"
      fr: "{count, plural, one {# événement métier décrit} other {# événements métier décrits}}"
    group: business
    status: planned
    glyph: event
    attributes:
      nature: { type: enum, values: [ business, technical, temporal ], label: { en: Nature, fr: Nature } }

  business_object:
    label: { en: Business object, fr: Objet métier }
    description:
      en: A business object is a thing the business names and handles, with its attributes and its lifecycle.
      fr: Un objet métier est une chose que le métier nomme et manipule, avec ses attributs et son cycle de vie.
    counted:
      en: "{count, plural, one {# business object described} other {# business objects described}}"
      fr: "{count, plural, one {# objet métier décrit} other {# objets métier décrits}}"
    group: business
    status: active
    glyph: object
    attributes:
      attributes: { type: "string[]", label: { en: Attributes, fr: Attributs } }
      lifecycle: { type: "string[]", label: { en: Lifecycle, fr: Cycle de vie } }
    display:
      highlight: [ lifecycle ]
      neighbours_order: [ screen, api, batch, data_object, rule, term ]

  business_service:
    label: { en: Business service, fr: Service métier }
    description:
      en: A business service is what the business offers to its users, delivered by processes and applications.
      fr: Un service métier est ce que le métier offre à ses utilisateurs, rendu par des processus et des applications.
    counted:
      en: "{count, plural, one {# business service described} other {# business services described}}"
      fr: "{count, plural, one {# service métier décrit} other {# services métier décrits}}"
    group: business
    status: planned
    glyph: service

  channel:
    label: { en: Channel, fr: Canal }
    description:
      en: "A channel is a way users reach the application: a website, a counter, a letter."
      fr: "Un canal est un moyen par lequel les utilisateurs atteignent l'application : un site, un guichet, un courrier."
    counted:
      en: "{count, plural, one {# channel described} other {# channels described}}"
      fr: "{count, plural, one {# canal décrit} other {# canaux décrits}}"
    group: application
    status: planned
    glyph: channel
    attributes:
      technology: { type: string, label: { en: Technology, fr: Technologie } }
      guarantee: { type: string, label: { en: Guarantee, fr: Garantie } }
      owner: { type: string, label: { en: Owner, fr: Responsable } }

  constraint:
    label: { en: Constraint, fr: Contrainte }
    description:
      en: A constraint is a limit the solution must respect, imposed from outside it.
      fr: Une contrainte est une limite que la solution doit respecter, imposée de l'extérieur.
    counted:
      en: "{count, plural, one {# constraint described} other {# constraints described}}"
      fr: "{count, plural, one {# contrainte décrite} other {# contraintes décrites}}"
    group: motivation
    status: planned
    glyph: constraint
    attributes:
      origin: { type: string, label: { en: Origin, fr: Origine } }

  data_object:
    label: { en: Data object, fr: Objet de données }
    description:
      en: A data object is a table or a record as it is stored, with its columns and their meaning.
      fr: Un objet de données est une table ou un enregistrement tel qu'il est stocké, avec ses colonnes et leur sens.
    counted:
      en: "{count, plural, one {# data object described} other {# data objects described}}"
      fr: "{count, plural, one {# objet de données décrit} other {# objets de données décrits}}"
    group: application
    status: active
    glyph: table
    attributes:
      business_object: { type: ref, target: business_object, relation: represents, label: { en: Business object, fr: Objet métier } }
      fields: { type: "string[]", label: { en: Fields, fr: Champs } }
      schema: { type: string, label: { en: Schema, fr: Schéma } }
    display:
      highlight: [ business_object, schema ]
      neighbours_order: [ business_object, batch, api, screen ]

  decision:
    label: { en: Decision, fr: Décision }
    description:
      en: A decision is a choice made for the project, with its context, its options and what it affects.
      fr: Une décision est un choix fait pour le projet, avec son contexte, ses options et ce qu'elle affecte.
    counted:
      en: "{count, plural, one {# decision described} other {# decisions described}}"
      fr: "{count, plural, one {# décision décrite} other {# décisions décrites}}"
    group: motivation
    status: active
    glyph: decision
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      nature: { type: enum, values: [ functional, technical ], label: { en: Nature, fr: Nature } }
      status: { type: enum, values: [ proposed, accepted, superseded ], label: { en: Status, fr: Statut } }
      affects: { type: "ref[]", target: any, relation: affects, label: { en: Affects, fr: Affecte } }
      supersedes: { type: ref, target: decision, relation: supersedes, label: { en: Supersedes, fr: Remplace } }
    sections:
      affects:
        heading: { en: Affects, fr: Affecte }
        parse: bullet-list
        produces: affects
    display:
      highlight: [ date, nature, status ]
      neighbours_order: [ screen, api, rule, process, business_object, meeting ]

  document:
    label: { en: Document, fr: Document }
    description:
      en: "A document is a file that frames the project without describing one of its parts: a vision, a roadmap, a note."
      fr: "Un document est un fichier qui cadre le projet sans en décrire une partie : une vision, une feuille de route, une note."
    counted:
      en: "{count, plural, one {# document described} other {# documents described}}"
      fr: "{count, plural, one {# document décrit} other {# documents décrits}}"
    group: raw
    status: active
    glyph: document
    graph: documents-only
    attributes:
      format: { type: string, label: { en: Format, fr: Format } }
      author: { type: string, label: { en: Author, fr: Auteur } }
      date: { type: date, label: { en: Date, fr: Date } }
      pages: { type: integer, label: { en: Pages, fr: Pages } }
      duration: { type: string, label: { en: Duration, fr: Durée } }
      representations: { type: "string[]", label: { en: Representations, fr: Représentations } }
      preview_available: { type: boolean, label: { en: Preview available, fr: Aperçu disponible } }
      source: { type: string, label: { en: Source, fr: Source } }
    display:
      highlight: [ format, date, author ]

  domain:
    label: { en: Domain, fr: Domaine }
    description:
      en: A domain is an area of the business that groups the objects, rules and processes about one subject.
      fr: Un domaine est une zone du métier qui regroupe les objets, les règles et les processus d'un même sujet.
    counted:
      en: "{count, plural, one {# domain described} other {# domains described}}"
      fr: "{count, plural, one {# domaine décrit} other {# domaines décrits}}"
    group: container
    status: active
    glyph: domain
    attributes:
      parent: { type: ref, target: domain, label: { en: Parent, fr: Parent } }
    display:
      highlight: [ parent ]

  endpoint:
    label: { en: Operation, fr: Opération }
    description:
      en: An operation is one call of an API, with its parameters and its responses as the contract declares them.
      fr: Une opération est un appel d'une API, avec ses paramètres et ses réponses tels que le contrat les déclare.
    counted:
      en: "{count, plural, one {# operation described} other {# operations described}}"
      fr: "{count, plural, one {# opération décrite} other {# opérations décrites}}"
    group: application
    status: active
    glyph: endpoint
    attributes:
      method: { type: string, label: { en: Method, fr: Méthode } }
      path: { type: string, label: { en: Path, fr: Chemin } }
      api: { type: ref, target: api, label: { en: API, fr: API } }
      operation_id: { type: string, label: { en: Operation id, fr: Identifiant d'opération } }
      style: { type: enum, values: [ http, soap ], label: { en: Style, fr: Style } }
      port: { type: string, label: { en: Port, fr: Port } }
      binding: { type: string, label: { en: Binding, fr: Binding } }
      soap_action: { type: string, label: { en: SOAP action, fr: Action SOAP } }
    sections:
      consumers:
        heading: { en: Consumers, fr: Consommateurs }
        parse: bullet-list
        produces: serves
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [ method, path ]
      neighbours_order: [ screen, rule, business_object ]

  function:
    label: { en: Application function, fr: Fonction applicative }
    description:
      en: An application function is a capability the application provides, whatever the screen or API that exposes it.
      fr: Une fonction applicative est une capacité que l'application fournit, quel que soit l'écran ou l'API qui l'expose.
    counted:
      en: "{count, plural, one {# application function described} other {# application functions described}}"
      fr: "{count, plural, one {# fonction applicative décrite} other {# fonctions applicatives décrites}}"
    group: application
    status: planned
    glyph: function
    attributes:
      execution: { type: string, label: { en: Execution, fr: Exécution } }
      triggers: { type: "string[]", label: { en: Triggers, fr: Déclencheurs } }

  gap:
    label: { en: Gap, fr: Écart }
    description:
      en: A gap is a difference between what exists and what is wanted, to be closed by a work package.
      fr: Un écart est une différence entre ce qui existe et ce qui est voulu, à combler par un lot.
    counted:
      en: "{count, plural, one {# gap described} other {# gaps described}}"
      fr: "{count, plural, one {# écart décrit} other {# écarts décrits}}"
    group: implementation
    status: planned
    glyph: gap
    attributes:
      from: { type: ref, target: plateau, label: { en: From, fr: De } }
      to: { type: ref, target: plateau, label: { en: To, fr: Vers } }

  goal:
    label: { en: Goal, fr: Objectif }
    description:
      en: A goal is an outcome the project or the business aims at, which principles and requirements serve.
      fr: Un objectif est un résultat que le projet ou le métier vise, que servent les principes et les exigences.
    counted:
      en: "{count, plural, one {# goal described} other {# goals described}}"
      fr: "{count, plural, one {# objectif décrit} other {# objectifs décrits}}"
    group: motivation
    status: planned
    glyph: goal

  meeting:
    label: { en: Meeting, fr: Réunion }
    description:
      en: A meeting is a session whose notes or transcript the documentation keeps, with its participants and what was decided.
      fr: Une réunion est une séance dont la documentation garde les notes ou la transcription, avec ses participants et ce qui a été décidé.
    counted:
      en: "{count, plural, one {# meeting described} other {# meetings described}}"
      fr: "{count, plural, one {# réunion décrite} other {# réunions décrites}}"
    group: raw
    status: active
    glyph: meeting
    graph: documents-only
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      participants: { type: "string[]", label: { en: Participants, fr: Participants } }
      decisions: { type: "ref[]", target: decision, relation: documents, label: { en: Decisions, fr: Décisions } }
      duration: { type: string, label: { en: Duration, fr: Durée } }
    display:
      highlight: [ date, duration, participants ]
      neighbours_order: [ decision, term, screen, api ]

  message:
    label: { en: Message, fr: Message }
    description:
      en: A message is a piece of information exchanged between two parts of the system, with its format.
      fr: Un message est une information échangée entre deux parties du système, avec son format.
    counted:
      en: "{count, plural, one {# message described} other {# messages described}}"
      fr: "{count, plural, one {# message décrit} other {# messages décrits}}"
    group: application
    status: planned
    glyph: message
    attributes:
      schema: { type: string, label: { en: Schema, fr: Schéma } }
      carries: { type: ref, target: business_event, label: { en: Carries, fr: Porte } }
      objects: { type: "ref[]", target: business_object, label: { en: Objects, fr: Objets } }

  milestone:
    label: { en: Milestone, fr: Jalon }
    description:
      en: A milestone is a date the project commits to, with what is delivered by then.
      fr: Un jalon est une date à laquelle le projet s'engage, avec ce qui est livré à cette échéance.
    counted:
      en: "{count, plural, one {# milestone described} other {# milestones described}}"
      fr: "{count, plural, one {# jalon décrit} other {# jalons décrits}}"
    group: implementation
    status: planned
    glyph: milestone
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }

  plateau:
    label: { en: Plateau, fr: Plateau }
    description:
      en: A plateau is a stable state of the architecture between two transitions.
      fr: Un plateau est un état stable de l'architecture entre deux transitions.
    counted:
      en: "{count, plural, one {# plateau described} other {# plateaus described}}"
      fr: "{count, plural, one {# plateau décrit} other {# plateaux décrits}}"
    group: implementation
    status: planned
    glyph: plateau
    attributes:
      date: { type: date, label: { en: Date, fr: Date } }
      applications: { type: "ref[]", target: application, label: { en: Applications, fr: Applications } }

  principle:
    label: { en: Principle, fr: Principe }
    description:
      en: A principle is a rule of conduct the project follows in its choices, which decisions refer to.
      fr: Un principe est une règle de conduite que le projet suit dans ses choix, à laquelle les décisions se réfèrent.
    counted:
      en: "{count, plural, one {# principle described} other {# principles described}}"
      fr: "{count, plural, one {# principe décrit} other {# principes décrits}}"
    group: motivation
    status: planned
    glyph: principle

  process:
    label: { en: Process, fr: Processus }
    description:
      en: A process is a sequence of steps the business or the tool follows, with the roles, screens and rules each step involves.
      fr: Un processus est une suite d'étapes que le métier ou l'outil suit, avec les rôles, les écrans et les règles que chaque étape engage.
    counted:
      en: "{count, plural, one {# process described} other {# processes described}}"
      fr: "{count, plural, one {# processus décrit} other {# processus décrits}}"
    group: business
    status: active
    glyph: process
    attributes:
      execution: { type: enum, values: [ human, service, mixed, scheduled ], label: { en: Execution, fr: Exécution } }
      triggers: { type: "string[]", label: { en: Triggers, fr: Déclencheurs } }
      steps: { type: list, label: { en: Steps, fr: Étapes } }
    sections:
      steps:
        heading: { en: Steps, fr: Étapes }
        parse: ordered-list
        produces: related
    display:
      highlight: [ execution, triggers ]
      neighbours_order: [ role, screen, api, business_object, rule ]

  representation:
    label: { en: Representation, fr: Représentation }
    description:
      en: "A representation is one form of a thing the documentation keeps: a note, a deck, a transcript."
      fr: "Une représentation est une forme d'une chose que la documentation conserve : une note, un diaporama, une transcription."
    counted:
      en: "{count, plural, one {# representation described} other {# representations described}}"
      fr: "{count, plural, one {# représentation décrite} other {# représentations décrites}}"
    group: business
    status: planned
    glyph: document
    attributes:
      format: { type: string, label: { en: Format, fr: Format } }
      channel: { type: string, label: { en: Channel, fr: Canal } }

  requirement:
    label: { en: Requirement, fr: Exigence }
    description:
      en: A requirement is something the solution must do or be, stated so that it can be checked.
      fr: Une exigence est quelque chose que la solution doit faire ou être, formulé pour pouvoir être vérifié.
    counted:
      en: "{count, plural, one {# requirement described} other {# requirements described}}"
      fr: "{count, plural, one {# exigence décrite} other {# exigences décrites}}"
    group: motivation
    status: planned
    glyph: requirement
    attributes:
      priority: { type: string, label: { en: Priority, fr: Priorité } }
      origin: { type: string, label: { en: Origin, fr: Origine } }

  role:
    label: { en: Role, fr: Rôle }
    description:
      en: A role is a kind of user, with the screens it uses and the processes it takes part in.
      fr: Un rôle est un type d'utilisateur, avec les écrans qu'il utilise et les processus auxquels il prend part.
    counted:
      en: "{count, plural, one {# role described} other {# roles described}}"
      fr: "{count, plural, one {# rôle décrit} other {# rôles décrits}}"
    group: business
    status: active
    glyph: role
    attributes:
      actors: { type: "ref[]", target: actor, label: { en: Actors, fr: Acteurs } }
    display:
      highlight: [ actors ]
      neighbours_order: [ process, screen ]

  rule:
    label: { en: Business rule, fr: Règle de gestion }
    description:
      en: A business rule is a condition the business imposes, with what it constrains and what happens when it is broken.
      fr: Une règle de gestion est une condition que le métier impose, avec ce qu'elle contraint et ce qui se passe quand elle est enfreinte.
    counted:
      en: "{count, plural, one {# business rule described} other {# business rules described}}"
      fr: "{count, plural, one {# règle de gestion décrite} other {# règles de gestion décrites}}"
    group: business
    status: active
    glyph: rule
    attributes:
      severity: { type: string, label: { en: Severity, fr: Sévérité } }
      condition: { type: string, label: { en: Condition, fr: Condition } }
      applies_to: { type: "ref[]", target: [ screen, process, business_object, api ], relation: constrains, label: { en: Applies to, fr: S'applique à } }
    sections:
      applies_to:
        heading: { en: Applies to, fr: S'applique à }
        parse: bullet-list
        produces: constrains
    display:
      highlight: [ severity, condition ]
      neighbours_order: [ screen, process, api, business_object, decision ]

  screen:
    label: { en: Screen, fr: Écran }
    description:
      en: A screen is a page of the application, with what it shows and what it allows.
      fr: Un écran est une page de l'application, avec ce qu'elle affiche et ce qu'elle permet.
    counted:
      en: "{count, plural, one {# screen described} other {# screens described}}"
      fr: "{count, plural, one {# écran décrit} other {# écrans décrits}}"
    group: application
    status: active
    glyph: screen
    attributes:
      roles: { type: "ref[]", target: role, relation: assigned_to, inverse: true, label: { en: Roles, fr: Rôles } }
      reads: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: read }, label: { en: Reads, fr: Lit } }
      writes: { type: "ref[]", target: [ business_object, data_object ], relation: accesses, attributes: { mode: write }, label: { en: Writes, fr: Écrit } }
      actions: { type: list, schema: { label: string, to: ref, condition: ref }, label: { en: Actions, fr: Actions } }
      rules: { type: "ref[]", target: rule, relation: constrains, inverse: true, label: { en: Rules, fr: Règles } }
      url_pattern: { type: string, label: { en: URL pattern, fr: Motif d'URL } }
    sections:
      objects:
        heading: { en: Objects, fr: Objets }
        parse: bullet-list
        produces: accesses
      actions:
        heading: { en: Actions, fr: Actions }
        parse: ordered-list
        produces: triggers
      rules:
        heading: { en: Rules, fr: Règles }
        parse: bullet-list
        produces: constrains
        inverse: true
    display:
      highlight: [ roles, url_pattern, status ]
      neighbours_order: [ business_object, data_object, screen, api, rule, process ]

  standard:
    label: { en: Standard, fr: Norme }
    description:
      en: A standard is an external norm the solution complies with.
      fr: Une norme est une référence externe à laquelle la solution se conforme.
    counted:
      en: "{count, plural, one {# standard described} other {# standards described}}"
      fr: "{count, plural, one {# norme décrite} other {# normes décrites}}"
    group: motivation
    status: planned
    glyph: standard
    attributes:
      applies_to_types: { type: "string[]", label: { en: Applies to types, fr: S'applique aux types } }
      mandatory: { type: boolean, label: { en: Mandatory, fr: Obligatoire } }
      version: { type: string, label: { en: Version, fr: Version } }

  term:
    label: { en: Term, fr: Terme }
    description:
      en: A term is a word of the business with its definition, its aliases and the words it relates to.
      fr: Un terme est un mot du métier avec sa définition, ses alias et les mots auxquels il se rapporte.
    counted:
      en: "{count, plural, one {# term described} other {# terms described}}"
      fr: "{count, plural, one {# terme décrit} other {# termes décrits}}"
    group: business
    status: active
    glyph: term
    attributes:
      broader: { type: ref, target: term, relation: specializes, label: { en: Broader term, fr: Terme générique } }
      narrower: { type: "ref[]", target: term, label: { en: Narrower terms, fr: Termes spécifiques } }
      synonyms: { type: "string[]", label: { en: Synonyms, fr: Synonymes } }
      definition: { type: string, label: { en: Definition, fr: Définition } }
    display:
      highlight: [ aliases, broader ]
      neighbours_order: [ term, business_object, screen, rule ]

  test:
    label: { en: Test, fr: Test }
    description:
      en: A test is a check of one behaviour of the solution, with what it exercises and what it expects.
      fr: Un test est une vérification d'un comportement de la solution, avec ce qu'il exerce et ce qu'il attend.
    counted:
      en: "{count, plural, one {# test described} other {# tests described}}"
      fr: "{count, plural, one {# test décrit} other {# tests décrits}}"
    group: quality
    status: planned
    glyph: test
    attributes:
      level: { type: string, label: { en: Level, fr: Niveau } }
      automated: { type: boolean, label: { en: Automated, fr: Automatisé } }
      covers: { type: "ref[]", target: [ process, screen, api, rule, requirement ], relation: covers, label: { en: Covers, fr: Couvre } }
      ref: { type: string, label: { en: Reference, fr: Référence } }

  test_strategy:
    label: { en: Test strategy, fr: Stratégie de test }
    description:
      en: A test strategy says which tests cover which parts of the solution and why.
      fr: Une stratégie de test dit quels tests couvrent quelles parties de la solution et pourquoi.
    counted:
      en: "{count, plural, one {# test strategy described} other {# test strategies described}}"
      fr: "{count, plural, one {# stratégie de test décrite} other {# stratégies de test décrites}}"
    group: quality
    status: planned
    glyph: strategy
    attributes:
      applies_to: { type: "ref[]", target: any, label: { en: Applies to, fr: S'applique à } }
      levels: { type: "string[]", label: { en: Levels, fr: Niveaux } }

  work_package:
    label: { en: Work package, fr: Lot }
    description:
      en: A work package is a bounded set of work that closes gaps and moves the project to its next plateau.
      fr: Un lot est un ensemble borné de travaux qui comble des écarts et mène le projet à son plateau suivant.
    counted:
      en: "{count, plural, one {# work package described} other {# work packages described}}"
      fr: "{count, plural, one {# lot décrit} other {# lots décrits}}"
    group: implementation
    status: planned
    glyph: package
    attributes:
      start: { type: date, label: { en: Start, fr: Début } }
      end: { type: date, label: { en: End, fr: Fin } }
      deliverables: { type: "string[]", label: { en: Deliverables, fr: Livrables } }

relations:
  composes:
    label: { en: composes, fr: compose }
    inverse_label: { en: is part of, fr: fait partie de }
    directed: true
    allowed:
      - [ application, screen ]
      - [ application, api ]
      - [ application, process ]
      - [ application, batch ]
      - [ application, channel ]
  assigned_to:
    label: { en: is assigned to, fr: est affecté à }
    inverse_label: { en: involves, fr: mobilise }
    directed: true
    allowed:
      - [ role, process ]
      - [ role, screen ]
      - [ actor, role ]
  realizes:
    label: { en: realizes, fr: réalise }
    inverse_label: { en: is realized by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [ process, business_service ]
      - [ function, business_service ]
  serves:
    label: { en: serves, fr: sert }
    inverse_label: { en: is served by, fr: est servi par }
    directed: true
    allowed:
      - [ api, screen ]
      - [ api, process ]
      - [ api, batch ]
      - [ endpoint, screen ]
      - [ screen, process ]
  exposes:
    label: { en: exposes, fr: expose }
    inverse_label: { en: is exposed by, fr: est exposé par }
    directed: true
    allowed:
      - [ api, endpoint ]
  accesses:
    label: { en: accesses, fr: accède à }
    inverse_label: { en: is accessed by, fr: est accédé par }
    directed: true
    attributes:
      mode: { type: enum, values: [ read, write, create, delete ] }
    allowed:
      - [ screen, business_object ]
      - [ screen, data_object ]
      - [ api, business_object ]
      - [ api, data_object ]
      - [ endpoint, business_object ]
      - [ batch, business_object ]
      - [ batch, data_object ]
      - [ function, business_object ]
      - [ function, data_object ]
  triggers:
    label: { en: triggers, fr: déclenche }
    inverse_label: { en: is triggered by, fr: est déclenché par }
    directed: true
    attributes:
      condition: { type: string }
      label: { type: string }
    allowed:
      - [ business_event, process ]
      - [ screen, screen ]
      - [ milestone, work_package ]
  flows_to:
    label: { en: flows to, fr: enchaîne vers }
    inverse_label: { en: follows, fr: fait suite à }
    directed: true
    attributes:
      object: { type: string }
    allowed:
      - [ process, process ]
      - [ batch, batch ]
  publishes:
    label: { en: publishes, fr: publie }
    inverse_label: { en: is published by, fr: est publié par }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [ process, channel ]
      - [ api, channel ]
      - [ batch, channel ]
      - [ function, channel ]
  subscribes:
    label: { en: subscribes to, fr: souscrit à }
    inverse_label: { en: has subscriber, fr: a pour abonné }
    directed: true
    status: planned
    attributes:
      message: { type: string }
    allowed:
      - [ process, channel ]
      - [ api, channel ]
      - [ batch, channel ]
      - [ function, channel ]
  carries:
    label: { en: carries, fr: porte }
    inverse_label: { en: is carried by, fr: est porté par }
    directed: true
    status: planned
    allowed:
      - [ message, business_event ]
      - [ representation, business_object ]
  constrains:
    label: { en: constrains, fr: contraint }
    inverse_label: { en: is constrained by, fr: est contraint par }
    directed: true
    allowed:
      - [ rule, screen ]
      - [ rule, process ]
      - [ rule, business_object ]
      - [ rule, api ]
      - [ rule, endpoint ]
      - [ constraint, requirement ]
  represents:
    label: { en: represents, fr: représente }
    inverse_label: { en: is represented by, fr: est représenté par }
    directed: true
    allowed:
      - [ data_object, business_object ]
      - [ term, business_object ]
  specializes:
    label: { en: specializes, fr: spécialise }
    inverse_label: { en: generalizes, fr: généralise }
    directed: true
    allowed:
      - [ term, term ]
      - [ business_object, business_object ]
  affects:
    label: { en: affects, fr: affecte }
    inverse_label: { en: is affected by, fr: est affecté par }
    directed: true
    allowed:
      - [ decision, any ]
  documents:
    label: { en: documents, fr: documente }
    inverse_label: { en: is documented by, fr: est documenté par }
    directed: true
    allowed:
      - [ document, any ]
      - [ meeting, any ]
  covers:
    label: { en: covers, fr: couvre }
    inverse_label: { en: is covered by, fr: est couvert par }
    directed: true
    status: planned
    attributes:
      level: { type: string }
    allowed:
      - [ test, process ]
      - [ test, screen ]
      - [ test, api ]
      - [ test, rule ]
      - [ test, requirement ]
  implements:
    label: { en: implements, fr: réalise }
    inverse_label: { en: is implemented by, fr: est réalisé par }
    directed: true
    status: planned
    allowed:
      - [ backlog_item, requirement ]
      - [ backlog_item, decision ]
      - [ backlog_item, screen ]
      - [ backlog_item, api ]
  applies_to:
    label: { en: applies to, fr: s'applique à }
    inverse_label: { en: is subject to, fr: est soumis à }
    directed: true
    status: planned
    target_kind: type
    allowed:
      - [ standard, type ]
  supersedes:
    label: { en: supersedes, fr: remplace }
    inverse_label: { en: is superseded by, fr: est remplacé par }
    directed: true
    attributes:
      date: { type: date }
    allowed:
      - [ any, same ]
  related:
    label: { en: is related to, fr: est lié à }
    directed: false
    cap: 0.6
    allowed:
      - [ any, any ]

confidence:
  explicit_link: 1.0
  lock_promoted: 1.0
  contract_import: 0.95
  frontmatter_ref: 0.9
  folder_zone: 0.9
  section_mention: 0.7
  glossary_occurrence:
    base: 0.6
    per_occurrence: 0.05
    cap: 0.8
    homonym_factor: 0.5
    type_prefix_bonus: 0.1
  cooccurrence: 0.4
  embedding: 0.25

# Words that announce the type of the entity that follows, per locale.
type_prefixes:
  en:
    screen: [ screen, page ]
    api: [ api, service ]
    data_object: [ table ]
    batch: [ batch, job ]
    rule: [ rule ]
    process: [ process ]
  fr:
    screen: [ écran, page ]
    api: [ api, service ]
    data_object: [ table ]
    batch: [ batch, traitement ]
    rule: [ règle ]
    process: [ processus ]
