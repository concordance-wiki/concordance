# Concordance brand tokens; paths are relative to this file. A white-label
# installation writes its own theme.yaml; it never touches the mark files.
# The palettes are those of the default theme of the site: the light one warm
# and the dark one measured on its own, never an inversion of the first.
name: Concordance
logo: concordance-mark.svg
favicon: favicon.svg
font:
  display: Instrument Sans
  ui: Instrument Sans
  mono: IBM Plex Mono
radius: 8
light:
  bg: "#EFEDE9"
  surface: "#FFFFFF"
  border: "#E3E0DA"
  ink: "#1F2124"
  muted: "#3A3E44"
  accent: "#A8431C"
  label: "#676C74"
  soft: "#F7F6F3"
  highlight: "#FBE3D4"
dark:
  bg: "#151618"
  surface: "#1C1E21"
  border: "#2E3136"
  ink: "#ECEAE5"
  muted: "#C5C3BD"
  accent: "#EE8B5C"
  label: "#9C9FA4"
  soft: "#232528"
  highlight: "#4A2A1B"
