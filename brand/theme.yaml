# Concordance brand tokens; paths are relative to this file. A white-label
# installation writes its own theme.yaml; it never touches the mark files.
# The palettes are those of the default theme of the site: the light one warm
# and the dark one measured on its own, never an inversion of the first: the
# ground goes under the surface the other way round, and the accent rises in
# lightness to hold 4.5:1 over the dark grounds.
name: Concordance
logo: concordance-mark.svg
favicon: favicon.svg
font:
  display: Instrument Sans
  ui: Instrument Sans
  mono: IBM Plex Mono
radius: 8
light:
  bg: "#EFEDE9"
  surface: "#FFFFFF"
  border: "#E3E0DA"
  ink: "#1F2124"
  muted: "#3A3E44"
  accent: "#A8431C"
  label: "#676C74"
  soft: "#F7F6F3"
  highlight: "#FBE3D4"
dark:
  bg: "#0F1113"
  surface: "#181B1E"
  border: "#282C31"
  ink: "#ECEAE6"
  muted: "#A8AEB6"
  accent: "#E8703A"
  label: "#8D939B"
  soft: "#22262A"
  highlight: "#4A2A1B"
