version: 1
project:
  name: Corpus réaliste
  locale: fr
# The office reader gives the Word twin of a rule its properties: the build groups it with the note.
plugins:
  - "@concordance-wiki/plugin-reader-office"
applications:
  - id: concordance-cli
    title: Ligne de commande Concordance
    status: active
  - id: concordance-service
    title: Service Concordance
    status: target
domains:
  - id: ingestion
    title: Ingestion
    match:
      - "**/*source*"
      - "**/*ressource*"
      - "**/*lecteur*"
      - "**/*convert*"
      - "**/*transcription*"
      - "**/*jumel*"
      - "**/*depot*"
      - "**/*identifiant*"
      - "**/*cache*"
      - "**/*pseudonym*"
      - "**/*donnees-personnelles*"
      - "**/*vie-privee*"
      - "**/*document*"
      - "**/*representation*"
      - "**/*clone*"
  - id: inference
    title: Inférence
    match:
      - "**/*lien*"
      - "**/*mention*"
      - "**/*provenance*"
      - "**/*confiance*"
      - "**/*voisin*"
      - "**/*relation*"
      - "**/*frontmatter*"
      - "**/*cooccurrence*"
      - "**/*lock*"
      - "**/*contrat*"
      - "**/*suggest*"
      - "**/*section*"
      - "**/*infer*"
    subdomains:
      - id: reconnaissance
        title: Reconnaissance
        match:
          - "**/*mot-cle*"
          - "**/occurrence*"
          - "**/*diction*"
          - "**/*alias*"
          - "**/*homonym*"
          - "**/*pack-de-langue*"
          - "**/*comparaison*"
          - "**/*seuil*"
          - "**/*candidat*"
          - "**/*rejet*"
          - "**/*reconnaiss*"
  - id: publication
    title: Publication
    match:
      - "**/*modele*"
      - "**/*site*"
      - "**/*page*"
      - "**/*theme*"
      - "**/*recherche*"
      - "**/*index*"
      - "**/*entit*"
      - "**/*profil*"
      - "**/*ilot*"
      - "**/*piste*"
      - "**/*accueil*"
      - "**/*locale*"
      - "**/*rendu*"
      - "**/*export*"
  - id: qualite
    title: Qualité
    match:
      - "**/*controle*"
      - "**/*constat*"
      - "**/*lint*"
      - "**/*build*"
      - "**/*determinis*"
      - "**/*fail-on*"
      - "**/*forge*"
      - "**/*obsole*"
      - "**/*a-faire*"
      - "**/*qualite*"
privacy:
  exclude: ["**/prive/**"]
sources:
  - name: glossaire
    path: ./glossaire
    locale: fr
    type: term
    glossary: true
    application: concordance-cli
  - name: specs
    path: ./specs
    locale: fr
    application: concordance-cli
    rules:
      - match: { path: "ecrans/**" }
        set: { type: screen }
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "objets/**" }
        set: { type: business_object }
      - match: { path: "processus/**" }
        set: { type: process }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batchs/**" }
        set: { type: batch }
      - match: { path: "operations/**" }
        set: { type: endpoint }
      - match: { suffix: ".regle.md" }
        set: { type: rule }
      - match: { suffix: ".table.md" }
        set: { type: data_object }
      - match: { path: "ecrans/service/**" }
        set: { type: screen, application: concordance-service }
  - name: decisions
    path: ./decisions
    locale: fr
    type: decision
    application: concordance-cli
  - name: reunions
    path: ./reunions
    locale: fr
    default_type: meeting
    application: concordance-cli
  - name: cadrage
    path: ./cadrage
    locale: fr
    default_type: document
    convert: true
inference:
  cross_source_links: true
  keyword_pages: { min_occurrences: 3, min_files: 2 }
staleness:
  warn_after_days: { default: 60, glossaire: 120 }
lock: ./concordance.lock.yaml
