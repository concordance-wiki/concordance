# Keyword pages expected above the threshold (3 occurrences in 2 files), and expressions expected below it.
# A minimum: other everyday expressions may cross the threshold, none of the unpublished ones may.
published:
  - { text: résumé de build, min_occurrences: 7, min_files: 3 }
unpublished:
  - { text: démarrage à froid, reason: "2 occurrences in 1 file" }
  - { text: reconstruction incrémentale, reason: "1 occurrence" }
  - { text: marque blanche, reason: "defined in the glossary; its only citation is excluded by privacy.exclude" }
