# Keyword pages expected above the threshold (3 occurrences in 2 files, a confidence of 0.5), expressions expected below it,
# and expressions at the threshold expected withheld by their confidence: discovered, searchable, without a page.
# A minimum: other everyday expressions may cross the threshold, none of the unpublished ones may.
# The lock file of the corpus rejects one expression the earlier builds published: it has no page, no finding, no candidate.
# `marked_once_in` names a note that uses the expression more than once: its page marks the first occurrence only.
published:
  - { text: résumé de build, min_occurrences: 7, min_files: 3, min_confidence: 0.8, marked_once_in: { source: cadrage, path: etude-du-rapport-de-lint.md } }
unpublished:
  - { text: démarrage à froid, reason: "2 occurrences in 1 file" }
  - { text: reconstruction incrémentale, reason: "1 occurrence" }
  - { text: marque blanche, reason: "defined in the glossary; its only citation is excluded by privacy.exclude" }
  - { text: dernier build, reason: "starts with a stopword of the language pack" }
  - { text: 180 jours, reason: "ends with a stopword of the language pack" }
  - { text: demande de fusion, reason: "a published expression of the earlier builds, rejected in the lock file: a term of the forge, not of the corpus" }
withheld:
  - { text: type, max_confidence: 0.5, reason: "once in each of its 16 files: a word of the prose, not a term of the corpus" }
  - { text: site statique, max_confidence: 0.5, reason: "once in each of its 5 files" }
