version: 1
project:
  name: Realistic corpus
  locale: en
# The office reader gives the Word twin of a rule its properties: the build groups it with the note.
plugins:
  - "@concordance-wiki/plugin-reader-office"
applications:
  - id: concordance-cli
    title: Concordance command line
    status: active
  - id: concordance-service
    title: Concordance service
    status: target
domains:
  - id: ingestion
    title: Ingestion
    match:
      - "**/*source*"
      - "**/*resource*"
      - "**/*reader*"
      - "**/*convert*"
      - "**/*transcript*"
      - "**/*twin*"
      - "**/*repository*"
      - "**/*identifier*"
      - "**/*cache*"
      - "**/*pseudonym*"
      - "**/*personal-data*"
      - "**/*privacy*"
      - "**/*document*"
      - "**/*representation*"
      - "**/*clone*"
  - id: inference
    title: Inference
    match:
      - "**/*link*"
      - "**/*mention*"
      - "**/*provenance*"
      - "**/*confiden*"
      - "**/*neighbour*"
      - "**/*relation*"
      - "**/*frontmatter*"
      - "**/*co-occurrence*"
      - "**/*lock*"
      - "**/*contract*"
      - "**/*suggest*"
      - "**/*section*"
      - "**/*infer*"
    subdomains:
      - id: recognition
        title: Recognition
        match:
          - "**/*keyword*"
          - "**/occurrence*"
          - "**/*diction*"
          - "**/*alias*"
          - "**/*homonym*"
          - "**/*language-pack*"
          - "**/*comparison*"
          - "**/*threshold*"
          - "**/*candidate*"
          - "**/*rejected*"
          - "**/*recogni*"
  - id: publication
    title: Publication
    match:
      - "**/*model*"
      - "**/*site*"
      - "**/*page*"
      - "**/*theme*"
      - "**/*search*"
      - "**/*index*"
      - "**/*entit*"
      - "**/*profile*"
      - "**/*island*"
      - "**/*trail*"
      - "**/*home*"
      - "**/*locale*"
      - "**/*render*"
      - "**/*export*"
  - id: quality
    title: Quality
    match:
      - "**/*check*"
      - "**/*finding*"
      - "**/*lint*"
      - "**/*build*"
      - "**/*determinism*"
      - "**/*fail-on*"
      - "**/*forge*"
      - "**/*stale*"
      - "**/*to-do*"
      - "**/*quality*"
privacy:
  exclude: ["**/private/**"]
sources:
  - name: glossary
    path: ./glossary
    type: term
    glossary: true
    application: concordance-cli
  - name: specs
    path: ./specs
    application: concordance-cli
    rules:
      - match: { path: "screens/**" }
        set: { type: screen }
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "objects/**" }
        set: { type: business_object }
      - match: { path: "processes/**" }
        set: { type: process }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batches/**" }
        set: { type: batch }
      - match: { path: "endpoints/**" }
        set: { type: endpoint }
      - match: { suffix: ".rule.md" }
        set: { type: rule }
      - match: { suffix: ".table.md" }
        set: { type: data_object }
      - match: { path: "screens/service/**" }
        set: { type: screen, application: concordance-service }
  - name: decisions
    path: ./decisions
    type: decision
    application: concordance-cli
  - name: meetings
    path: ./meetings
    default_type: meeting
    application: concordance-cli
  - name: framing
    path: ./framing
    default_type: document
    convert: true
inference:
  cross_source_links: true
  keyword_pages: { min_occurrences: 3, min_files: 2 }
staleness:
  warn_after_days: { default: 60, glossary: 120 }
lock: ./concordance.lock.yaml
