# Findings the engine must produce, sorted by check then path. The list is a minimum: every entry must be present;
# further I-REL-AMBIGUOUS findings on other prose mentions are allowed.
- { check: I-REL-AMBIGUOUS, path: specs/screens/mentions-panel.md, note: "explicit link (term) mentioned in prose falls back to related" }
- { check: I-TERM-HOMONYM, form: build, entities: [glossary/build, specs/objects/build] }
- { check: I-TERM-HOMONYM, form: entity, entities: [glossary/entity, specs/objects/entity] }
- { check: I-TERM-HOMONYM, form: link, entities: [glossary/link, specs/objects/link] }
- { check: W-DOMAIN-UNCLASSIFIED, path: decisions/cap-checked-upstream.md }
- { check: W-DOMAIN-UNCLASSIFIED, path: glossary/build.md }
- { check: W-DOMAIN-UNCLASSIFIED, path: specs/objects/build.md }
- { check: W-DOMAIN-UNCLASSIFIED, path: specs/roles/maintainer.md }
- { check: W-TERM-UNDEFINED, text: build summary, min_occurrences: 5, min_files: 3 }
