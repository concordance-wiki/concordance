version: 1
project:
  name: Minimal corpus
  locale: en
applications:
  - id: concordance-cli
    title: Concordance command line
    status: active
domains:
  - id: publication
    title: Publication
    match: ["**/*entit*"]
  - id: inference
    title: Inference
    match: ["**/*link*", "**/*mention*", "**/nightly-build*", "**/model-query*", "**/neighbourhood-map*"]
sources:
  - name: glossary
    path: ./glossary
    type: term
    glossary: true
    application: concordance-cli
  - name: specs
    path: ./specs
    application: concordance-cli
    rules:
      - match: { path: "screens/**" }
        set: { type: screen }
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "objects/**" }
        set: { type: business_object }
      - match: { path: "processes/**" }
        set: { type: process }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batches/**" }
        set: { type: batch }
      - match: { suffix: ".rule.md" }
        set: { type: rule }
      - match: { suffix: ".table.md" }
        set: { type: data_object }
  - name: decisions
    path: ./decisions
    type: decision
    application: concordance-cli
  - name: meetings
    path: ./meetings
    default_type: meeting
    application: concordance-cli
inference:
  cross_source_links: true
  keyword_pages: { min_occurrences: 3, min_files: 2 }
