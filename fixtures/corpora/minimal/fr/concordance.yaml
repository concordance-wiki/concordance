version: 1
project:
  name: Corpus minimal
  locale: fr
applications:
  - id: concordance-cli
    title: Ligne de commande Concordance
    status: active
domains:
  - id: publication
    title: Publication
    match: ["**/*entite*"]
  - id: inference
    title: Inférence
    match: ["**/*lien*", "**/*mention*", "**/build-nocturne*", "**/requete-de-modele*", "**/carte-de-voisinage*"]
sources:
  - name: glossaire
    path: ./glossaire
    locale: fr
    type: term
    glossary: true
    application: concordance-cli
  - name: specs
    path: ./specs
    locale: fr
    application: concordance-cli
    rules:
      - match: { path: "ecrans/**" }
        set: { type: screen }
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "objets/**" }
        set: { type: business_object }
      - match: { path: "processus/**" }
        set: { type: process }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batchs/**" }
        set: { type: batch }
      - match: { suffix: ".regle.md" }
        set: { type: rule }
      - match: { suffix: ".table.md" }
        set: { type: data_object }
  - name: decisions
    path: ./decisions
    locale: fr
    type: decision
    application: concordance-cli
  - name: reunions
    path: ./reunions
    locale: fr
    default_type: meeting
    application: concordance-cli
inference:
  cross_source_links: true
  keyword_pages: { min_occurrences: 3, min_files: 2 }
