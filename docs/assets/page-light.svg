    <!-- title -->
    <text x="40" y="176" font-size="40" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" fill="#16181B">Free payment</text>

    <!-- body -->
    <text font-size="16" fill="#24272C" xml:space="preserve">
      <tspan x="40" y="220">A </tspan><tspan fill="#A83F1B" text-decoration="underline">payment</tspan><tspan> made at the member's request, outside any schedule, on a</tspan>
      <tspan x="40" y="246">running </tspan><tspan fill="#A83F1B" text-decoration="underline">contract</tspan><tspan>. It differs from the </tspan><tspan fill="#16181B" font-weight="600">scheduled payment</tspan><tspan> by the</tspan>
      <tspan x="40" y="272">absence of periodicity.</tspan>
    </text>
    <text x="40" y="322" font-size="20" font-weight="600" fill="#16181B">Not to be confused with</text>
    <text font-size="16" fill="#24272C" xml:space="preserve">
      <tspan x="40" y="352">An </tspan><tspan fill="#16181B" font-weight="600">exceptional payment</tspan><tspan>, which sits outside the contractual frame and is</tspan>
      <tspan x="40" y="378">validated by the branch manager.</tspan>
    </text>

    <!-- legend -->
    <line x1="52" y1="431" x2="72" y2="431" stroke="#A83F1B" stroke-width="2"/>
