      <circle cx="640" cy="374" r="6" fill="none" stroke="#16181B" stroke-width="1.5"/><text x="656" y="379">Payments workshop</text><text x="820" y="379" font-size="12" fill="#8B9199">meeting · 7</text>
      <text x="676" y="401" font-size="12" fill="#4E5259" xml:space="preserve">12:04  “…the scheduled payment, the <tspan fill="#16181B" font-weight="600">free payment</tspan>, and the exceptional…”</text>
      <text x="676" y="421" font-size="12" fill="#4E5259" xml:space="preserve">13:02  “On the <tspan fill="#16181B" font-weight="600">free payment</tspan>, the cap stays server-side.”</text>
      <rect x="634" y="442" width="12" height="12" rx="1" fill="none" stroke="#16181B" stroke-width="1.5"/><text x="656" y="453">Payments framing v3</text><text x="820" y="453" font-size="12" fill="#8B9199">slides · 5</text>
