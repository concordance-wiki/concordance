      <path d="M634 260 l6 -6 l6 6 l-6 6 z" fill="#16181B"/><text x="656" y="271">Cap checked server-side</text><text x="850" y="271" font-size="12" fill="#8B9199">decision · Affects</text>
      <text x="656" y="301" font-size="12" fill="#8B9199">12 more</text>
